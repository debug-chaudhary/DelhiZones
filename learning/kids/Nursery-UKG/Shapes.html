﻿﻿<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>fetch('/includes/head.html').then(r=>r.text()).then(t=>{const range=document.createRange();range.selectNode(document.head);const frag=range.createContextualFragment(t);document.head.appendChild(frag);});</script>
    <title>Shapes - Learn Geometry | Kids Zone</title>
    
    <!-- Favicon -->

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'comic': ['"Comic Neue"', 'cursive'],
                        'sans': ['Fredoka', 'sans-serif'],
                    },
                    colors: {
                        'kid-blue': '#4facfe',
                        'kid-pink': '#ff9a9e',
                        'kid-yellow': '#f6d365',
                        'kid-green': '#84fab0',
                        'kid-purple': '#a18cd1',
                        'kid-orange': '#ffc3a0',
                        'kid-teal': '#20c997',
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Confetti JS -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body { font-family: 'Comic Neue', cursive; }
        h1, h2, h3, h4, .shape-font { font-family: 'Fredoka', sans-serif; }
        
        .shape-card {
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }
        .shape-card:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.1);
        }
        .shape-card:active {
            transform: scale(0.95);
        }
        
        .speaking {
            background-color: #f0f9ff !important;
            border-color: #4facfe !important;
            transform: scale(1.1) !important;
            z-index: 10;
            box-shadow: 0 0 20px rgba(79, 172, 254, 0.6);
        }

        .animate-float { animation: float 6s ease-in-out infinite; }
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
    </style>
<link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
<link rel="manifest" href="/assets/icons/site.webmanifest">
</head>
<body class="bg-teal-50 text-slate-800">

    <!-- Main Content -->
    <main class="container mx-auto px-4 pt-28 pb-10">
        
        <div class="flex justify-between items-center mb-8">
            <a href="/EDU/Kids/nursery-ukg/index.html" class="flex items-center gap-2 text-slate-600 hover:text-kid-teal transition-colors font-bold text-lg">
                <i data-lucide="arrow-left-circle" class="w-6 h-6"></i> Back
            </a>
            <button onclick="playAll()" class="flex items-center gap-2 px-4 py-2 bg-kid-yellow text-slate-800 rounded-full font-bold hover:bg-yellow-400 transition-colors shadow-md">
                <i data-lucide="play" class="w-5 h-5"></i> Auto Play
            </button>
        </div>
        
        <!-- Header -->
        <div class="text-center mb-12 relative">
            <div class="absolute top-0 left-10 text-6xl animate-float opacity-30 hidden md:block">🟧</div>
            <div class="absolute top-0 right-10 text-6xl animate-float opacity-30 hidden md:block" style="animation-delay: 1.5s">🔵</div>

            <h1 class="text-4xl md:text-6xl font-black text-slate-800 mb-4">
                Let's Learn Shapes!
            </h1>
            <p class="text-xl text-slate-500 font-bold">Tap a shape to hear its name 🔷</p>
        </div>

        <!-- Shapes Grid -->
        <div id="shapes-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8 max-w-6xl mx-auto">
            <!-- Cards generated by JS -->
        </div>

    </main>

    <script>
        lucide.createIcons();

        const shapesData = [
            { 
                name: 'Circle', 
                color: 'text-red-500', 
                bg: 'bg-red-50', 
                border: 'border-red-200',
                svg: '<circle cx="50" cy="50" r="40" fill="currentColor" />' 
            },
            { 
                name: 'Square', 
                color: 'text-blue-500', 
                bg: 'bg-blue-50', 
                border: 'border-blue-200',
                svg: '<rect x="15" y="15" width="70" height="70" rx="4" fill="currentColor" />' 
            },
            { 
                name: 'Triangle', 
                color: 'text-green-500', 
                bg: 'bg-green-50', 
                border: 'border-green-200',
                svg: '<path d="M50 15 L85 85 L15 85 Z" fill="currentColor" stroke-linejoin="round" stroke-width="4"/>' 
            },
            { 
                name: 'Rectangle', 
                color: 'text-yellow-500', 
                bg: 'bg-yellow-50', 
                border: 'border-yellow-200',
                svg: '<rect x="10" y="25" width="80" height="50" rx="4" fill="currentColor" />' 
            },
            { 
                name: 'Star', 
                color: 'text-purple-500', 
                bg: 'bg-purple-50', 
                border: 'border-purple-200',
                svg: '<path d="M50 10 L61 35 L88 35 L66 50 L75 75 L50 60 L25 75 L34 50 L12 35 L39 35 Z" fill="currentColor" />' 
            },
            { 
                name: 'Heart', 
                color: 'text-pink-500', 
                bg: 'bg-pink-50', 
                border: 'border-pink-200',
                svg: '<path d="M50 80 C10 50 0 25 25 10 S50 30 50 30 S60 -5 75 10 C100 25 90 50 50 80 Z" fill="currentColor" />' 
            },
            { 
                name: 'Oval', 
                color: 'text-orange-500', 
                bg: 'bg-orange-50', 
                border: 'border-orange-200',
                svg: '<ellipse cx="50" cy="50" rx="40" ry="25" fill="currentColor" />' 
            },
            { 
                name: 'Diamond', 
                color: 'text-cyan-500', 
                bg: 'bg-cyan-50', 
                border: 'border-cyan-200',
                svg: '<path d="M50 10 L80 50 L50 90 L20 50 Z" fill="currentColor" />' 
            },
            { 
                name: 'Pentagon', 
                color: 'text-indigo-500', 
                bg: 'bg-indigo-50', 
                border: 'border-indigo-200',
                svg: '<path d="M50 10 L90 40 L75 85 L25 85 L10 40 Z" fill="currentColor" />' 
            },
            { 
                name: 'Hexagon', 
                color: 'text-teal-500', 
                bg: 'bg-teal-50', 
                border: 'border-teal-200',
                svg: '<path d="M25 10 L75 10 L100 50 L75 90 L25 90 L0 50 Z" fill="currentColor" />' 
            }
        ];

        const grid = document.getElementById('shapes-grid');

        // Render Cards
        shapesData.forEach((shape, index) => {
            const card = document.createElement('div');
            card.className = `shape-card ${shape.bg} rounded-3xl p-8 border-b-8 ${shape.border} flex flex-col items-center justify-center relative overflow-hidden group`;
            card.id = `shape-${index}`;
            card.onclick = () => speak(shape, index);
            
            card.innerHTML = `
                <div class="w-40 h-40 mb-6 transition-transform duration-300 group-hover:scale-110 group-hover:rotate-6 ${shape.color}">
                    <svg viewBox="0 0 100 100" class="w-full h-full drop-shadow-md">
                        ${shape.svg}
                    </svg>
                </div>
                <h3 class="text-3xl font-black text-slate-700 mb-2 shape-font">${shape.name}</h3>
                <div class="absolute top-4 right-4 opacity-0 group-hover:opacity-50 transition-opacity">
                    <i data-lucide="volume-2" class="w-6 h-6 text-slate-600"></i>
                </div>
            `;
            grid.appendChild(card);
        });

        lucide.createIcons();

        // Text to Speech
        function speak(shape, index) {
            if (speechSynthesis.speaking) speechSynthesis.cancel();

            const card = document.getElementById(`shape-${index}`);
            document.querySelectorAll('.shape-card').forEach(c => c.classList.remove('speaking'));
            card.classList.add('speaking');
            
            const text = `This is a ${shape.name}`;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.9;
            utterance.pitch = 1.1;

            const voices = speechSynthesis.getVoices();
            const preferredVoice = voices.find(voice => voice.name.includes('Google US English'));
            if (preferredVoice) utterance.voice = preferredVoice;
            
            utterance.onend = () => {
                card.classList.remove('speaking');
                if(Math.random() > 0.7) triggerConfetti(card);
            };

            speechSynthesis.speak(utterance);
        }

        function triggerConfetti(element) {
            const rect = element.getBoundingClientRect();
            const x = (rect.left + rect.width / 2) / window.innerWidth;
            const y = (rect.top + rect.height / 2) / window.innerHeight;
            
            confetti({
                particleCount: 40,
                spread: 50,
                origin: { x: x, y: y },
                colors: ['#4facfe', '#ff9a9e', '#f6d365', '#84fab0'],
                disableForReducedMotion: true
            });
        }

        async function playAll() {
            for (let i = 0; i < shapesData.length; i++) {
                const card = document.getElementById(`shape-${i}`);
                card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                speak(shapesData[i], i);
                await new Promise(r => setTimeout(r, 2000));
            }
        }
        
        window.speechSynthesis.onvoiceschanged = () => {};
    </script>
</body>
</html>
