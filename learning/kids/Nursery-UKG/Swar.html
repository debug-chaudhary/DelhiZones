﻿﻿<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>fetch('/includes/head.html').then(r=>r.text()).then(t=>{const range=document.createRange();range.selectNode(document.head);const frag=range.createContextualFragment(t);document.head.appendChild(frag);});</script>
    <title>Hindi Swar - Learn Vowels | Kids Zone</title>
    
    <!-- Favicon -->

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'comic': ['"Comic Neue"', 'cursive'],
                        'hindi': ['"Noto Sans Devanagari"', 'sans-serif'],
                    },
                    colors: {
                        'kid-orange': '#ffc3a0',
                        'kid-yellow': '#f6d365',
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Confetti JS -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body { font-family: 'Comic Neue', cursive; }
        .hindi-font { font-family: 'Noto Sans Devanagari', sans-serif; }
        
        .swar-card {
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }
        .swar-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 15px 30px -5px rgba(255, 165, 0, 0.2);
        }
        .swar-card:active {
            transform: scale(0.95);
        }
        
        .speaking {
            border-color: #f6d365 !important;
            background-color: #fff9c4 !important;
            transform: scale(1.05) !important;
            z-index: 10;
            box-shadow: 0 0 20px rgba(246, 211, 101, 0.6);
        }

        .animate-float { animation: float 6s ease-in-out infinite; }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
    </style>
<link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
<link rel="manifest" href="/assets/icons/site.webmanifest">
</head>
<body class="bg-orange-50 text-slate-800">

    <!-- Main Content -->
    <main class="container mx-auto px-4 pt-28 pb-10">
        
        <div class="flex justify-between items-center mb-8">
            <a href="/EDU/Kids/nursery-ukg/index.html" class="flex items-center gap-2 text-slate-600 hover:text-orange-500 transition-colors font-bold text-lg">
                <i data-lucide="arrow-left-circle" class="w-6 h-6"></i> Back
            </a>
            <button onclick="playAll()" class="flex items-center gap-2 px-4 py-2 bg-orange-500 text-white rounded-full font-bold hover:bg-orange-600 transition-colors shadow-md">
                <i data-lucide="play" class="w-5 h-5"></i> Auto Play
            </button>
        </div>
        
        <!-- Header -->
        <div class="text-center mb-12 relative">
            <div class="absolute top-0 left-10 text-6xl animate-float opacity-30 hidden md:block">🥭</div>
            <div class="absolute top-0 right-10 text-6xl animate-float opacity-30 hidden md:block" style="animation-delay: 1.5s">🦉</div>

            <h1 class="text-4xl md:text-6xl font-black text-slate-800 mb-4 hindi-font">
                स्वर माला (Vowels)
            </h1>
            <p class="text-xl text-slate-500 font-bold">Click to listen and learn! 👂</p>
        </div>

        <!-- Swar Grid -->
        <div id="swar-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6 max-w-6xl mx-auto">
            <!-- Cards generated by JS -->
        </div>

    </main>

    <script>
        lucide.createIcons();

        const swarData = [
            { letter: 'अ', word: 'अनार', eng: 'Pomegranate', emoji: '🍎', soundText: 'अ से अनार' },
            { letter: 'आ', word: 'आम', eng: 'Mango', emoji: '🥭', soundText: 'आ से आम' },
            { letter: 'इ', word: 'इमली', eng: 'Tamarind', emoji: '🫘', soundText: 'इ से इमली' }, // Tamarind emoji approximation
            { letter: 'ई', word: 'ईख', eng: 'Sugarcane', emoji: '🎋', soundText: 'ई से ईख' },
            { letter: 'उ', word: 'उल्लू', eng: 'Owl', emoji: '🦉', soundText: 'उ से उल्लू' },
            { letter: 'ऊ', word: 'ऊन', eng: 'Wool', emoji: '🧶', soundText: 'ऊ से ऊन' },
            { letter: 'ऋ', word: 'ऋषि', eng: 'Sage', emoji: '🧘', soundText: 'ऋ से ऋषि' },
            { letter: 'ए', word: 'एड़ी', eng: 'Heel', emoji: '🦶', soundText: 'ए से एड़ी' },
            { letter: 'ऐ', word: 'ऐनक', eng: 'Spectacles', emoji: '👓', soundText: 'ऐ से ऐनक' },
            { letter: 'ओ', word: 'ओखली', eng: 'Mortar', emoji: '🥣', soundText: 'ओ से ओखली' },
            { letter: 'औ', word: 'औरत', eng: 'Woman', emoji: '👩', soundText: 'औ से औरत' },
            { letter: 'अं', word: 'अंगूर', eng: 'Grapes', emoji: '🍇', soundText: 'अं से अंगूर' },
            { letter: 'अः', word: 'नमः', eng: 'Namah', emoji: '🙏', soundText: 'अः खाली' }
        ];

        const grid = document.getElementById('swar-grid');

        // Render Cards
        swarData.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = `swar-card bg-white rounded-3xl p-6 border-b-8 border-orange-200 flex flex-col items-center justify-center relative overflow-hidden group`;
            card.id = `swar-${index}`;
            card.onclick = () => speak(item, index);
            
            card.innerHTML = `
                <div class="text-6xl md:text-8xl font-bold text-orange-500 hindi-font mb-4 transition-transform group-hover:scale-110">
                    ${item.letter}
                </div>
                <div class="text-5xl mb-2 group-hover:animate-bounce cursor-pointer select-none">${item.emoji}</div>
                <div class="text-2xl font-bold text-slate-700 hindi-font">${item.word}</div>
                <div class="text-sm font-bold text-slate-400 uppercase tracking-wide mt-1">${item.eng}</div>
                
                <div class="absolute top-2 right-2 opacity-20 group-hover:opacity-100 transition-opacity">
                    <i data-lucide="volume-2" class="w-6 h-6 text-orange-400"></i>
                </div>
            `;
            grid.appendChild(card);
        });

        lucide.createIcons();

        // Text to Speech
        function speak(item, index) {
            if (speechSynthesis.speaking) speechSynthesis.cancel();

            const card = document.getElementById(`swar-${index}`);
            document.querySelectorAll('.swar-card').forEach(c => c.classList.remove('speaking'));
            card.classList.add('speaking');
            
            const utterance = new SpeechSynthesisUtterance(item.soundText);
            utterance.lang = 'hi-IN'; // Set language to Hindi
            utterance.rate = 0.8;
            
            // Fallback if Hindi voice not found (though modern browsers usually have it)
            // Ideally, we check voices, but sticking to default lang usually works for common locales.

            utterance.onend = () => {
                card.classList.remove('speaking');
                if(Math.random() > 0.7) triggerConfetti(card);
            };

            speechSynthesis.speak(utterance);
        }

        function triggerConfetti(element) {
            const rect = element.getBoundingClientRect();
            const x = (rect.left + rect.width / 2) / window.innerWidth;
            const y = (rect.top + rect.height / 2) / window.innerHeight;
            
            confetti({
                particleCount: 40,
                spread: 50,
                origin: { x: x, y: y },
                colors: ['#ff9a9e', '#f6d365', '#ffc3a0'],
                disableForReducedMotion: true
            });
        }

        async function playAll() {
            for (let i = 0; i < swarData.length; i++) {
                const card = document.getElementById(`swar-${i}`);
                card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                speak(swarData[i], i);
                await new Promise(r => setTimeout(r, 2500));
            }
        }
    </script>
</body>
</html>
