<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    
    <title>Edu-Manager | School & Tuition Fee Management Tool</title>
    <meta name="description" content="Free tool to manage school fees, tuition installments, and student records. Dashboard for students and administrators.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://delhizones.com/learning/edu-fees-manager/">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#2563EB', darkBg: '#0f172a' },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/assets/js/loader.js?v=4.3" defer></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Tool-Specific Styles */
        .sidebar-link { transition: all 0.2s ease-in-out; }
        .sidebar-link:hover, .sidebar-link.active { background-color: rgba(255,255,255,0.1); color: white; border-right: 3px solid #60a5fa; }
        
        /* App Container Scrollbar */
        .app-scroll::-webkit-scrollbar { width: 6px; }
        .app-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
        .app-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .app-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Fix for injected navbar layout shift */
        #navbar-placeholder { min-height: 80px; display: block; }
        #footer-placeholder { min-height: 300px; display: block; }
    </style>
<link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
<link rel="manifest" href="/assets/icons/site.webmanifest">
</head>

<body class="bg-slate-100 text-slate-800 flex flex-col min-h-screen">

    <div id="navbar-placeholder"></div>

    <main class="flex-grow pt-8 pb-12 px-4 sm:px-6">
        <div class="container mx-auto max-w-7xl h-full flex flex-col">
            
            <div class="mb-6 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                <div>
                    <div class="flex items-center gap-2 text-sm text-slate-500 mb-1">
                        <a href="/learning/" class="hover:text-blue-600">Learning</a>
                        <i data-lucide="chevron-right" class="h-4 w-4"></i>
                        <span class="text-slate-800 font-medium">Tools</span>
                    </div>
                    <h1 class="text-2xl font-bold text-slate-900">Edu-Fees Manager</h1>
                </div>
                
                <div class="bg-white p-1.5 rounded-lg shadow-sm border border-slate-200 inline-flex">
                    <button id="roleStudent" class="px-4 py-1.5 rounded-md text-sm font-bold transition-all bg-blue-100 text-blue-700" onclick="switchRole('student')">Student View</button>
                    <button id="roleAdmin" class="px-4 py-1.5 rounded-md text-sm font-medium text-slate-500 hover:bg-slate-50 transition-all" onclick="switchRole('admin')">Admin View</button>
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden flex flex-col md:flex-row min-h-[700px] md:h-[750px] relative">
                
                <aside id="app-sidebar" class="bg-slate-900 text-slate-300 w-full md:w-64 flex-shrink-0 md:flex flex-col border-r border-slate-800 hidden absolute inset-y-0 left-0 z-20 md:relative">
                    <div class="p-6 border-b border-slate-800 flex justify-between items-center md:block">
                        <div class="flex items-center gap-3">
                            <div class="bg-blue-600 p-2 rounded-lg text-white">
                                <i data-lucide="book-open" class="h-5 w-5"></i>
                            </div>
                            <span class="font-bold text-white tracking-tight">Menu</span>
                        </div>
                        <button class="md:hidden text-white" onclick="toggleAppSidebar()">
                            <i data-lucide="x" class="h-6 w-6"></i>
                        </button>
                    </div>

                    <nav id="nav-menu" class="flex-1 py-4 space-y-1 overflow-y-auto app-scroll">
                        </nav>

                    <div class="p-4 bg-slate-900 border-t border-slate-800">
                        <div class="flex items-center gap-3 p-3 bg-slate-800 rounded-lg">
                            <div class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center text-white font-bold text-sm" id="user-initial">A</div>
                            <div class="overflow-hidden">
                                <p id="user-name" class="text-xs font-bold text-white truncate">User</p>
                                <p id="user-role" class="text-[10px] text-slate-400 truncate">Role</p>
                            </div>
                        </div>
                    </div>
                </aside>

                <div class="flex-1 flex flex-col bg-slate-50 relative">
                    
                    <div class="md:hidden bg-white border-b border-slate-200 p-4 flex justify-between items-center">
                        <span class="font-bold text-slate-700" id="mobile-page-title">Dashboard</span>
                        <button onclick="toggleAppSidebar()" class="p-2 bg-slate-100 rounded-lg text-slate-600">
                            <i data-lucide="menu" class="h-5 w-5"></i>
                        </button>
                    </div>

                    <div id="main-content" class="flex-1 overflow-y-auto app-scroll p-6 md:p-8">
                        </div>
                </div>

            </div>

        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            
            // --- DATA & STATE ---
            let currentRole = 'student';
            const sidebar = document.getElementById('app-sidebar');
            
            const studentData = {
                name: "Rohan Sharma",
                role: "Student (Class X)",
                stats: [
                    { label: "Attendance", value: "94%", icon: "user-check", color: "green" },
                    { label: "Pending Fees", value: "₹2,500", icon: "alert-circle", color: "red" },
                    { label: "Next Exam", value: "Maths", icon: "calendar", color: "blue" },
                    { label: "Assignments", value: "2 Due", icon: "file-text", color: "orange" }
                ],
                fees: [
                    { id: "#INV-001", date: "10 Jan 2026", desc: "Tuition Fee (Jan)", amount: 2500, status: "Paid" },
                    { id: "#INV-002", date: "10 Feb 2026", desc: "Tuition Fee (Feb)", amount: 2500, status: "Pending" }
                ]
            };

            const adminData = {
                name: "Principal Desk",
                role: "Administrator",
                stats: [
                    { label: "Total Revenue", value: "₹4.2L", icon: "wallet", color: "green" },
                    { label: "Pending Dues", value: "₹45k", icon: "alert-triangle", color: "red" },
                    { label: "Active Students", value: "142", icon: "users", color: "blue" },
                    { label: "New Inquiries", value: "8", icon: "inbox", color: "orange" }
                ],
                students: [
                    { name: "Rohan Sharma", class: "X-A", fee: "Pending", amount: "₹2,500" },
                    { name: "Anjali Gupta", class: "IX-B", fee: "Paid", amount: "₹0" },
                    { name: "Vikram Singh", class: "X-A", fee: "Paid", amount: "₹0" },
                    { name: "Sanya Malhotra", class: "XI-C", fee: "Overdue", amount: "₹5,000" }
                ]
            };

            const navLinks = {
                student: [
                    { name: "Dashboard", icon: "layout-dashboard", view: "dashboard" },
                    { name: "My Fees", icon: "credit-card", view: "fees" },
                    { name: "Timetable", icon: "calendar-days", view: "timetable" },
                    { name: "Report Card", icon: "graduation-cap", view: "report" }
                ],
                admin: [
                    { name: "Overview", icon: "bar-chart-3", view: "admin-dash" },
                    { name: "Student List", icon: "users", view: "students" },
                    { name: "Fee Collection", icon: "indian-rupee", view: "collection" },
                    { name: "Settings", icon: "settings", view: "settings" }
                ]
            };

            // --- GLOBAL FUNCTIONS ---
            window.switchRole = function(role) {
                currentRole = role;
                
                // Update Toggle UI
                const btnStudent = document.getElementById('roleStudent');
                const btnAdmin = document.getElementById('roleAdmin');
                
                if(role === 'student') {
                    btnStudent.className = "px-4 py-1.5 rounded-md text-sm font-bold transition-all bg-blue-100 text-blue-700 shadow-sm";
                    btnAdmin.className = "px-4 py-1.5 rounded-md text-sm font-medium text-slate-500 hover:bg-slate-50 transition-all";
                } else {
                    btnAdmin.className = "px-4 py-1.5 rounded-md text-sm font-bold transition-all bg-blue-100 text-blue-700 shadow-sm";
                    btnStudent.className = "px-4 py-1.5 rounded-md text-sm font-medium text-slate-500 hover:bg-slate-50 transition-all";
                }

                initializeApp(role);
            };

            window.toggleAppSidebar = function() {
                sidebar.classList.toggle('hidden');
                sidebar.classList.toggle('flex');
            }

            window.switchView = function(view) {
                const user = currentRole === 'student' ? studentData : adminData;
                let content = '';

                // Generate Content
                if (currentRole === 'student' && view === 'dashboard') {
                    content = renderStudentDashboard();
                } else if (currentRole === 'student' && view === 'fees') {
                    content = renderStudentFees();
                } else if (currentRole === 'admin' && view === 'admin-dash') {
                    content = renderAdminDashboard();
                } else if (currentRole === 'admin' && view === 'students') {
                    content = renderAdminStudents();
                } else {
                    content = renderPlaceholder(view.replace('-', ' ').toUpperCase());
                }

                document.getElementById('main-content').innerHTML = `<div class="fade-in space-y-6">${content}</div>`;
                
                // Update Nav Active State
                document.querySelectorAll('.sidebar-link').forEach(link => {
                    link.classList.remove('active', 'bg-slate-800', 'text-white', 'border-blue-500');
                    if(link.dataset.view === view) link.classList.add('active', 'bg-slate-800', 'text-white', 'border-blue-500');
                });
                
                // Update Mobile Title
                const cleanTitle = view.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                document.getElementById('mobile-page-title').innerText = cleanTitle;

                if(window.innerWidth < 768) sidebar.classList.add('hidden'); // Close sidebar on mobile
                lucide.createIcons();
            }

            // --- TEMPLATES ---
            function renderStudentDashboard() {
                return `
                    <div class="flex items-center justify-between">
                        <h2 class="text-2xl font-bold text-slate-800">Welcome, ${studentData.name} 👋</h2>
                        <span class="text-xs font-bold bg-green-100 text-green-700 px-3 py-1 rounded-full">Academic Year 2025-26</span>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                        ${studentData.stats.map(stat => `
                            <div class="bg-white p-5 rounded-xl border border-slate-200 flex items-center justify-between hover:shadow-md transition">
                                <div>
                                    <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">${stat.label}</p>
                                    <p class="text-2xl font-bold text-slate-800 mt-1">${stat.value}</p>
                                </div>
                                <div class="p-3 bg-${stat.color}-50 text-${stat.color}-600 rounded-lg">
                                    <i data-lucide="${stat.icon}" class="h-6 w-6"></i>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="bg-white rounded-xl border border-slate-200 overflow-hidden">
                        <div class="p-5 border-b border-slate-100 flex justify-between items-center">
                            <h3 class="font-bold text-slate-800">Fee Payment History</h3>
                            <button onclick="switchView('fees')" class="text-xs font-bold text-blue-600 hover:underline">View All</button>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-sm text-left">
                                <thead class="bg-slate-50 text-slate-500 uppercase text-xs">
                                    <tr>
                                        <th class="px-6 py-3">Invoice</th>
                                        <th class="px-6 py-3">Date</th>
                                        <th class="px-6 py-3">Description</th>
                                        <th class="px-6 py-3">Amount</th>
                                        <th class="px-6 py-3">Status</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    ${studentData.fees.map(fee => `
                                        <tr class="hover:bg-slate-50">
                                            <td class="px-6 py-4 font-medium text-blue-600">${fee.id}</td>
                                            <td class="px-6 py-4 text-slate-500">${fee.date}</td>
                                            <td class="px-6 py-4 text-slate-600">${fee.desc}</td>
                                            <td class="px-6 py-4 font-bold">₹${fee.amount}</td>
                                            <td class="px-6 py-4">
                                                <span class="px-2 py-1 rounded text-xs font-bold ${fee.status === 'Paid' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">
                                                    ${fee.status}
                                                </span>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            }

            function renderAdminDashboard() {
                return `
                    <div class="flex items-center justify-between">
                        <h2 class="text-2xl font-bold text-slate-800">Admin Overview 📊</h2>
                        <button class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-bold shadow hover:bg-blue-700 transition">
                            + Add Fees
                        </button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                        ${adminData.stats.map(stat => `
                            <div class="bg-white p-5 rounded-xl border border-slate-200 flex items-center justify-between">
                                <div>
                                    <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">${stat.label}</p>
                                    <p class="text-2xl font-bold text-slate-800 mt-1">${stat.value}</p>
                                </div>
                                <div class="p-3 bg-${stat.color}-50 text-${stat.color}-600 rounded-lg">
                                    <i data-lucide="${stat.icon}" class="h-6 w-6"></i>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="bg-white rounded-xl border border-slate-200 overflow-hidden">
                        <div class="p-5 border-b border-slate-100">
                            <h3 class="font-bold text-slate-800">Recent Student Payments</h3>
                        </div>
                        <table class="w-full text-sm text-left">
                            <thead class="bg-slate-50 text-slate-500 uppercase text-xs">
                                <tr>
                                    <th class="px-6 py-3">Student</th>
                                    <th class="px-6 py-3">Class</th>
                                    <th class="px-6 py-3">Amount</th>
                                    <th class="px-6 py-3">Status</th>
                                    <th class="px-6 py-3">Action</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100">
                                ${adminData.students.map(stu => `
                                    <tr>
                                        <td class="px-6 py-4 font-bold text-slate-700">${stu.name}</td>
                                        <td class="px-6 py-4 text-slate-500">${stu.class}</td>
                                        <td class="px-6 py-4 font-mono">${stu.amount}</td>
                                        <td class="px-6 py-4">
                                            <span class="px-2 py-1 rounded text-xs font-bold ${stu.fee === 'Paid' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">
                                                ${stu.fee}
                                            </span>
                                        </td>
                                        <td class="px-6 py-4">
                                            <button class="text-blue-600 hover:bg-blue-50 p-2 rounded-full transition"><i data-lucide="mail" class="h-4 w-4"></i></button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            }

            function renderPlaceholder(title) {
                return `
                    <div class="flex flex-col items-center justify-center h-[500px] border-2 border-dashed border-slate-200 rounded-xl bg-slate-50">
                        <div class="p-4 bg-white rounded-full mb-4 shadow-sm">
                            <i data-lucide="hammer" class="h-8 w-8 text-slate-300"></i>
                        </div>
                        <h3 class="text-xl font-bold text-slate-600">${title} Module</h3>
                        <p class="text-sm text-slate-400 mt-2">This feature is under development.</p>
                    </div>
                `;
            }

            function renderStudentFees() {
                // Similar to dashboard table but dedicated page logic can go here
                return renderPlaceholder("Detailed Fee Breakdown");
            }
            
            function renderAdminStudents() {
                 return renderPlaceholder("Student Directory");
            }

            function initializeApp(role) {
                const user = role === 'student' ? studentData : adminData;
                
                // Update Sidebar Profile
                document.getElementById('user-name').textContent = user.name;
                document.getElementById('user-role').textContent = user.role;
                document.getElementById('user-initial').textContent = user.name.charAt(0);
                
                // Render Menu
                const links = navLinks[role];
                document.getElementById('nav-menu').innerHTML = links.map(link => `
                    <a href="#" data-view="${link.view}" class="sidebar-link flex items-center space-x-3 py-3 px-6 text-sm font-medium text-slate-400 hover:text-white border-r-4 border-transparent">
                        <i data-lucide="${link.icon}" class="h-5 w-5"></i>
                        <span>${link.name}</span>
                    </a>
                `).join('');

                // Add Listeners
                document.querySelectorAll('.sidebar-link').forEach(link => {
                    link.addEventListener('click', (e) => {
                        e.preventDefault();
                        switchView(e.currentTarget.dataset.view);
                    });
                });

                // Load Default View
                const startView = role === 'student' ? 'dashboard' : 'admin-dash';
                switchView(startView);
            }

            // Start
            initializeApp('student');
        });
    </script>
</body>
</html>
