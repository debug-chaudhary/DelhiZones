<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Delhizones</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#2563EB', darkBg: '#0f172a' } } } }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/assets/js/loader.js" defer></script>
</head>

<body class="theme-body transition-colors duration-300 flex flex-col min-h-screen">
    
    <main class="flex-grow flex items-center justify-center p-4">
        <div class="theme-bg-secondary text-center p-10 md:p-16 rounded-3xl shadow-2xl border border-black/5 max-w-lg mx-auto">
            
            <div class="mb-6 inline-flex items-center justify-center w-24 h-24 bg-red-100 text-red-500 rounded-full">
                <i data-lucide="alert-triangle" class="w-12 h-12"></i>
            </div>

            <h1 class="text-6xl font-extrabold mb-2 theme-text-main">404</h1>
            <h2 class="text-2xl font-bold mb-4 theme-text-sec">Page Not Found</h2>
            
            <p class="mb-8 opacity-70">
                Oops! The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
            </p>

            <div class="flex flex-col gap-3">
                <a href="/index.html" class="px-8 py-3 bg-blue-600 text-white font-bold rounded-full hover:bg-blue-700 transition-colors shadow-lg shadow-blue-500/30">
                    Go Back Home
                </a>
                <a href="/Contact.html" class="text-sm font-semibold opacity-60 hover:opacity-100 hover:underline">
                    Report Broken Link
                </a>
            </div>

        </div>
    </main>

</body>
</html>
