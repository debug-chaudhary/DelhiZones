    <script>
        (function(){
            // Helper: Close Dropdowns when clicking outside
            function closeOnClickOutside(menuId, btnId) {
                document.addEventListener('click', (e) => {
                    const menu = document.getElementById(menuId);
                    const btn = document.getElementById(btnId);
                    if (!menu || !btn) return;
                    if (!menu.contains(e.target) && !btn.contains(e.target)) {
                        menu.classList.add('hidden');
                        const icon = document.getElementById('nav-more-icon');
                        if(icon && menuId === 'nav-more-menu') icon.style.transform = 'rotate(0deg)';
                    }
                });
            }

            // 1. "More" Dropdown Logic
            const moreBtn = document.getElementById('nav-more-btn');
            const moreMenu = document.getElementById('nav-more-menu');
            const moreIcon = document.getElementById('nav-more-icon');

            if(moreBtn && moreMenu) {
                moreBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const isHidden = moreMenu.classList.contains('hidden');
                    document.getElementById('theme-palette-menu')?.classList.add('hidden');
                    
                    if(isHidden) {
                        moreMenu.classList.remove('hidden');
                        moreIcon.style.transform = 'rotate(180deg)';
                    } else {
                        moreMenu.classList.add('hidden');
                        moreIcon.style.transform = 'rotate(0deg)';
                    }
                });
                closeOnClickOutside('nav-more-menu', 'nav-more-btn');
            }

            // 2. Theme Palette Logic
            const themeBtn = document.getElementById('theme-palette-btn');
            const themeMenu = document.getElementById('theme-palette-menu');

            if(themeBtn && themeMenu) {
                themeBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const isHidden = themeMenu.classList.contains('hidden');
                    document.getElementById('nav-more-menu')?.classList.add('hidden');
                    if(document.getElementById('nav-more-icon')) {
                         document.getElementById('nav-more-icon').style.transform = 'rotate(0deg)';
                    }

                    if(isHidden) themeMenu.classList.remove('hidden');
                    else themeMenu.classList.add('hidden');
                });
                
                themeMenu.querySelectorAll('button').forEach(btn => {
                    btn.addEventListener('click', () => themeMenu.classList.add('hidden'));
                });
                
                closeOnClickOutside('theme-palette-menu', 'theme-palette-btn');
            }

            // 3. Mobile Menu Logic
            const mobileMenuBtn = document.getElementById('mobile-menu-button');
            const mobileMenu = document.getElementById('mobile-menu');
            const openIcon = document.getElementById('menu-open-icon');
            const closeIcon = document.getElementById('menu-close-icon');

            if(mobileMenuBtn && mobileMenu) {
                mobileMenuBtn.addEventListener('click', () => {
                    mobileMenu.classList.toggle('hidden');
                    if(openIcon) openIcon.classList.toggle('hidden');
                    if(closeIcon) closeIcon.classList.toggle('hidden');
                });
                
                const menuLinks = mobileMenu.getElementsByTagName('a');
                for(let link of menuLinks) {
                    link.addEventListener('click', () => {
                        mobileMenu.classList.add('hidden');
                        if(openIcon) openIcon.classList.remove('hidden');
                        if(closeIcon) closeIcon.classList.add('hidden');
                    });
                }
            }

            // 4. PWA Install Logic
            const navInstallBtn = document.getElementById('install-app-btn');
            const mobileInstallBtn = document.getElementById('mobile-install-app-btn');

            function updateNavInstallVisibility() {
                if (window.deferredPrompt) {
                    if(navInstallBtn) navInstallBtn.classList.remove('hidden');
                    if(mobileInstallBtn) mobileInstallBtn.classList.remove('hidden');
                }
            }
            window.addEventListener('beforeinstallprompt', updateNavInstallVisibility);
            if(window.deferredPrompt) updateNavInstallVisibility();

            // 5. Icons
            if(window.lucide) window.lucide.createIcons();
        })();
    </script>
