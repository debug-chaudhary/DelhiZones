    <script>
        // 1. Update Mode Icons UI
        function updateModeIcons(activeMode) {
            ['mode-light', 'mode-dark', 'mode-system'].forEach(id => {
                const el = document.getElementById(id);
                if(el) {
                    el.style.color = '';
                    el.setAttribute('aria-pressed', 'false');
                }
            });
            const activeId = activeMode === 'light' ? 'mode-light' : 
                             activeMode === 'dark' ? 'mode-dark' : 'mode-system';
            const activeEl = document.getElementById(activeId);
            if(activeEl) {
                activeEl.style.color = 'var(--accent)';
                activeEl.setAttribute('aria-pressed', 'true');
            }
        }

        // 2. Intercept SetMode to update UI
        const originalSetMode = window.setMode;
        window.setMode = function(mode) {
            if(originalSetMode) originalSetMode(mode);
            updateModeIcons(mode);
        }

        // 3. Initialize on Load
        (function() {
            const saved = localStorage.getItem('selected-theme');
            let current = 'system';
            if (saved === 'dark' || saved === 'default') {
                current = saved === 'dark' ? 'dark' : 'light';
            }
            updateModeIcons(current);
            
            // Initialize Lucide icons - run after DOM is ready
            if(window.lucide) {
                window.lucide.createIcons();
                // Recreate search icons specifically
                setTimeout(() => {
                    window.lucide.createIcons();
                }, 100);
            }

            // PWA Safety Check
            if(typeof window.installPWA !== 'function') {
                const btn = document.getElementById('install-app-btn');
                if(btn) btn.style.display = 'none';
            }
        })();

        // 4. Share Logic
        function shareWebsite() {
            if (navigator.share) {
                navigator.share({ title: 'Delhizones', text: 'The ultimate guide to Delhi', url: window.location.href }).catch(console.error);
            } else {
                navigator.clipboard.writeText(window.location.href).then(() => alert('Link copied!'));
            }
        }

        // 5. Dropdown Logic
        function toggleDropdown(id, event) {
            if(event) event.stopPropagation();
            const menu = document.getElementById(id);
            const btn = event ? event.currentTarget : null;
            
            // Close all others first
            document.querySelectorAll('.dropdown-content').forEach(m => {
                if(m.id !== id) m.classList.add('hidden');
            });
            document.querySelectorAll('.dropdown-btn[aria-expanded]').forEach(b => {
                if(b !== btn) b.setAttribute('aria-expanded', 'false');
            });

            const isHidden = menu.classList.contains('hidden');
            
            if (isHidden && btn) {
                menu.classList.remove('hidden');
                btn.setAttribute('aria-expanded', 'true');
                
                // Positioning Logic
                const rect = btn.getBoundingClientRect();
                if (id === 'theme-menu') {
                     menu.style.top = (rect.bottom + 10) + 'px';
                     menu.style.right = (window.innerWidth - rect.right) + 'px';
                     menu.style.left = 'auto';
                } else {
                    menu.style.top = (rect.bottom + 10) + 'px';
                    if (rect.left + 224 > window.innerWidth) {
                        menu.style.left = 'auto'; menu.style.right = '10px';
                    } else {
                        menu.style.left = rect.left + 'px'; menu.style.right = 'auto';
                    }
                }
            } else if (btn) {
                menu.classList.add('hidden');
                btn.setAttribute('aria-expanded', 'false');
            }
        }

        // Close on outside click
        document.addEventListener('click', e => {
            if (!e.target.closest('.dropdown-content') && !e.target.closest('.dropdown-btn')) {
                document.querySelectorAll('.dropdown-content').forEach(m => m.classList.add('hidden'));
                document.querySelectorAll('.dropdown-btn[aria-expanded]').forEach(b => b.setAttribute('aria-expanded', 'false'));
            }
        });

        // External search script will handle search functionality
    </script>
