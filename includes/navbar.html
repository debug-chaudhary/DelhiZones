    <script>
        (function(){
            // 1. Mobile Menu Logic
            const mobileMenuBtn = document.getElementById('mobile-menu-button');
            const mobileMenu = document.getElementById('mobile-menu');
            const openIcon = document.getElementById('menu-open-icon');
            const closeIcon = document.getElementById('menu-close-icon');

            if(mobileMenuBtn && mobileMenu) {
                mobileMenuBtn.addEventListener('click', () => {
                    mobileMenu.classList.toggle('hidden');
                    if(openIcon) openIcon.classList.toggle('hidden');
                    if(closeIcon) closeIcon.classList.toggle('hidden');
                });
                
                // Close menu when links clicked
                const menuLinks = mobileMenu.getElementsByTagName('a');
                for(let link of menuLinks) {
                    link.addEventListener('click', () => {
                        mobileMenu.classList.add('hidden');
                        if(openIcon) openIcon.classList.remove('hidden');
                        if(closeIcon) closeIcon.classList.add('hidden');
                    });
                }
            }

            // 2. Active Link Highlighter
            // Automatically colors the link blue if the URL matches
            const currentPath = window.location.pathname;
            const allLinks = document.querySelectorAll('.nav-link, #mobile-menu a');
            
            allLinks.forEach(link => {
                const linkPath = link.getAttribute('href');
                if (linkPath === '/' && currentPath === '/') return; // Skip home strict match here
                if (linkPath !== '/' && currentPath.includes(linkPath)) {
                    link.classList.add('text-blue-600', 'font-bold');
                    link.classList.remove('theme-text-sec');
                }
            });

            // 3. PWA Install Logic
            const navInstallBtn = document.getElementById('install-app-btn');
            const mobileInstallBtn = document.getElementById('mobile-install-app-btn');

            function updateNavInstallVisibility() {
                if (window.deferredPrompt) {
                    if(navInstallBtn) navInstallBtn.classList.remove('hidden');
                    if(mobileInstallBtn) mobileInstallBtn.classList.remove('hidden');
                }
            }

            window.addEventListener('beforeinstallprompt', updateNavInstallVisibility);
            updateNavInstallVisibility(); // Check on load

            async function installApp() {
                if (window.deferredPrompt) {
                    window.deferredPrompt.prompt();
                    const { outcome } = await window.deferredPrompt.userChoice;
                    window.deferredPrompt = null;
                    updateNavInstallVisibility();
                }
            }

            if(navInstallBtn) navInstallBtn.addEventListener('click', installApp);
            if(mobileInstallBtn) mobileInstallBtn.addEventListener('click', installApp);
            
            // 4. Icons
            if(window.lucide) window.lucide.createIcons();
        })();
    </script>
