<!-- Reusable site-wide head include for Delhizones -->
<meta name="theme-color" content="#2563EB">
<link rel="icon" href="/favicon.ico" />
<link rel="manifest" href="/manifest.json">
<!-- Default Open Graph image and site metadata (can be overridden per page) -->
<meta property="og:site_name" content="Delhizones">
<meta property="og:image" content="https://delhizones.com/assets/og-default.png">
<meta name="twitter:site" content="@delhizones">

<!-- Site-wide structured data -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Delhizones",
  "url": "https://delhizones.com",
  "logo": "https://delhizones.com/favicon.ico"
}
</script>

<!-- PWA Install Prompt Capture -->
<script>
  window.deferredPrompt = window.deferredPrompt || null;
  window.addEventListener('beforeinstallprompt', (e) => {
    console.log('PWA: beforeinstallprompt fired');
    e.preventDefault();
    window.deferredPrompt = e;
  });
</script>

<!-- Service Worker Registration -->
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }
</script>

<!-- Dynamic canonical setter: if a page hasn't set a canonical, this will add one based on location -->
<script>
  (function(){
    try {
      if(!document.querySelector('link[rel="canonical"]')){
        var link = document.createElement('link');
        link.rel = 'canonical';
        link.href = window.location.origin + window.location.pathname;
        document.head.appendChild(link);
      }
    }catch(e){/* fail silently */}
  })();
</script>

<!-- Auto-inject site-wide navbar and footer for pages that include this head -->
<script>
  (function(){
    function insert(path, where){
      fetch(path).then(r=>r.text()).then(html=>{
        if(!html) return;
        const range = document.createRange();
        range.selectNode(document.body); 
        const frag = range.createContextualFragment(html);
        if(where === 'top') document.body.insertBefore(frag, document.body.firstChild);
        else if(where === 'bottom') document.body.appendChild(frag);
      }).catch(e=>{});
    }
    if (document.readyState === 'loading'){
      document.addEventListener('DOMContentLoaded', function(){ insert('/includes/navbar.html','top'); insert('/includes/footer.html','bottom'); });
    } else {
      insert('/includes/navbar.html','top'); insert('/includes/footer.html','bottom');
    }
  })();
</script>
