<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>fetch('/includes/head.html').then(r=>r.text()).then(t=>document.head.insertAdjacentHTML('beforeend',t));</script>
    <title>Counting 1-100 - Learn Numbers | Kids Zone</title>
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3e%3ctext y='28' font-size='28'%3e🔢%3c/text%3e%3c/svg%3e">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'comic': ['"Comic Neue"', 'cursive'],
                        'sans': ['Fredoka', 'sans-serif'],
                    },
                    colors: {
                        'kid-blue': '#4facfe',
                        'kid-pink': '#ff9a9e',
                        'kid-yellow': '#f6d365',
                        'kid-green': '#84fab0',
                        'kid-purple': '#a18cd1',
                        'kid-orange': '#ffc3a0',
                        'kid-red': '#ff6b6b',
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Confetti JS -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body { font-family: 'Comic Neue', cursive; }
        h1, h2, h3, h4, .num-font { font-family: 'Fredoka', sans-serif; }
        
        .number-card {
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            aspect-ratio: 1/1;
        }
        .number-card:hover {
            transform: translateY(-5px) scale(1.1);
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.15);
            z-index: 10;
        }
        .number-card:active {
            transform: scale(0.95);
        }
        
        .speaking {
            background-color: #fff9c4 !important;
            border-color: #f6d365 !important;
            transform: scale(1.2) !important;
            z-index: 20;
            box-shadow: 0 0 25px rgba(246, 211, 101, 0.8);
        }

        .animate-float { animation: float 6s ease-in-out infinite; }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body class="bg-red-50 text-slate-800">

    <!-- Navbar -->
    <nav class="fixed w-full z-50 bg-white/95 backdrop-blur-md border-b-4 border-kid-red shadow-sm rounded-b-3xl">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <a href="/EDU/Kids/nursery-ukg/index.html" class="flex items-center gap-2 text-slate-600 hover:text-kid-red transition-colors font-bold text-lg">
                <i data-lucide="arrow-left-circle" class="w-8 h-8"></i>
                Back
            </a>
            
            <span class="text-2xl font-black text-kid-red tracking-wide">
                Counting <span class="text-slate-800">1-100</span>
            </span>

            <button onclick="playAll()" class="hidden md:flex items-center gap-2 px-4 py-2 bg-kid-yellow text-slate-800 rounded-full font-bold hover:bg-yellow-400 transition-colors shadow-md">
                <i data-lucide="play" class="w-5 h-5"></i> Count All
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto px-4 pt-28 pb-10">
        
        <!-- Header -->
        <div class="text-center mb-10 relative">
            <div class="absolute top-0 left-10 text-6xl animate-float opacity-30 hidden md:block">🔢</div>
            <div class="absolute top-0 right-10 text-6xl animate-float opacity-30 hidden md:block" style="animation-delay: 1.5s">🧮</div>

            <h1 class="text-4xl md:text-6xl font-black text-slate-800 mb-2">
                Let's Count!
            </h1>
            <p class="text-xl text-slate-500 font-bold">Tap a number to say it aloud 🗣️</p>
        </div>

        <!-- Numbers Grid -->
        <div id="numbers-grid" class="grid grid-cols-5 sm:grid-cols-6 md:grid-cols-8 lg:grid-cols-10 gap-3 sm:gap-4 max-w-6xl mx-auto">
            <!-- Generated by JS -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-8 text-slate-400 font-bold">
        <p>Numbers are magic! ✨</p>
    </footer>

    <script>
        lucide.createIcons();

        const grid = document.getElementById('numbers-grid');
        
        // Colors for rows to make it look like a rainbow table
        const rowColors = [
            { bg: 'bg-red-100', border: 'border-red-300', text: 'text-red-600' },
            { bg: 'bg-orange-100', border: 'border-orange-300', text: 'text-orange-600' },
            { bg: 'bg-yellow-100', border: 'border-yellow-300', text: 'text-yellow-600' },
            { bg: 'bg-green-100', border: 'border-green-300', text: 'text-green-600' },
            { bg: 'bg-teal-100', border: 'border-teal-300', text: 'text-teal-600' },
            { bg: 'bg-blue-100', border: 'border-blue-300', text: 'text-blue-600' },
            { bg: 'bg-indigo-100', border: 'border-indigo-300', text: 'text-indigo-600' },
            { bg: 'bg-purple-100', border: 'border-purple-300', text: 'text-purple-600' },
            { bg: 'bg-pink-100', border: 'border-pink-300', text: 'text-pink-600' },
            { bg: 'bg-rose-100', border: 'border-rose-300', text: 'text-rose-600' }
        ];

        // Generate Numbers 1-100
        for (let i = 1; i <= 100; i++) {
            const rowIdx = Math.floor((i - 1) / 10) % 10;
            const style = rowColors[rowIdx];
            
            const card = document.createElement('div');
            card.className = `number-card ${style.bg} rounded-xl border-b-4 ${style.border} flex items-center justify-center relative overflow-hidden group shadow-sm select-none`;
            card.id = `num-${i}`;
            card.onclick = () => speak(i);

            card.innerHTML = `
                <span class="text-3xl md:text-4xl font-black ${style.text} num-font">${i}</span>
            `;
            grid.appendChild(card);
        }

        // TTS Logic
        function speak(number) {
            if (speechSynthesis.speaking) speechSynthesis.cancel();

            const card = document.getElementById(`num-${number}`);
            
            document.querySelectorAll('.number-card').forEach(c => c.classList.remove('speaking'));
            card.classList.add('speaking');

            const utterance = new SpeechSynthesisUtterance(number.toString());
            utterance.rate = 1; 
            utterance.pitch = 1.2; 
            
            const voices = speechSynthesis.getVoices();
            const preferredVoice = voices.find(voice => voice.name.includes('Google US English'));
            if (preferredVoice) utterance.voice = preferredVoice;

            utterance.onend = () => {
                card.classList.remove('speaking');
                // Celebrate every 10 numbers or random
                if(number % 10 === 0 || Math.random() > 0.9) triggerConfetti(card);
            };

            speechSynthesis.speak(utterance);
        }

        function triggerConfetti(element) {
            const rect = element.getBoundingClientRect();
            const x = (rect.left + rect.width / 2) / window.innerWidth;
            const y = (rect.top + rect.height / 2) / window.innerHeight;
            
            confetti({
                particleCount: 20,
                spread: 30,
                origin: { x: x, y: y },
                colors: ['#4facfe', '#ff9a9e', '#f6d365'],
                disableForReducedMotion: true,
                shapes: ['circle']
            });
        }

        async function playAll() {
            for (let i = 1; i <= 100; i++) {
                const card = document.getElementById(`num-${i}`);
                card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                speak(i);
                // Wait approx 1 second between numbers
                await new Promise(r => setTimeout(r, 1200));
            }
        }
        
        window.speechSynthesis.onvoiceschanged = () => {};
    </script>
</body>
</html>
