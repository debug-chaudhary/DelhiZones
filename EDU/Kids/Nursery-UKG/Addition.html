<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Addition - Learn Math | Kids Zone</title>
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3e%3ctext y='28' font-size='28'%3e➕%3c/text%3e%3c/svg%3e">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'comic': ['"Comic Neue"', 'cursive'],
                        'sans': ['Fredoka', 'sans-serif'],
                    },
                    colors: {
                        'kid-blue': '#4facfe',
                        'kid-pink': '#ff9a9e',
                        'kid-yellow': '#f6d365',
                        'kid-green': '#84fab0',
                        'kid-purple': '#a18cd1',
                        'kid-orange': '#ffc3a0',
                        'kid-red': '#ff6b6b',
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Confetti JS -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body { font-family: 'Comic Neue', cursive; }
        h1, h2, h3, h4, .math-font { font-family: 'Fredoka', sans-serif; }
        
        .math-card {
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }
        .math-card:hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.1);
        }
        .math-card:active {
            transform: scale(0.95);
        }
        
        .speaking {
            background-color: #fff5f5 !important;
            border-color: #ff6b6b !important;
            transform: scale(1.05) !important;
            z-index: 10;
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.6);
        }

        .animate-float { animation: float 6s ease-in-out infinite; }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body class="bg-red-50 text-slate-800">

    <!-- Navbar -->
    <nav class="fixed w-full z-50 bg-white/95 backdrop-blur-md border-b-4 border-kid-red shadow-sm rounded-b-3xl">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <a href="/EDU/Kids/nursery-ukg/index.html" class="flex items-center gap-2 text-slate-600 hover:text-kid-red transition-colors font-bold text-lg">
                <i data-lucide="arrow-left-circle" class="w-8 h-8"></i>
                Back
            </a>
            
            <span class="text-2xl font-black text-kid-red tracking-wide">
                Math <span class="text-slate-800">Fun</span>
            </span>

            <button onclick="playAll()" class="hidden md:flex items-center gap-2 px-4 py-2 bg-kid-yellow text-slate-800 rounded-full font-bold hover:bg-yellow-400 transition-colors shadow-md">
                <i data-lucide="play" class="w-5 h-5"></i> Auto Play
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto px-4 pt-28 pb-10">
        
        <!-- Header -->
        <div class="text-center mb-12 relative">
            <div class="absolute top-0 left-10 text-6xl animate-float opacity-30 hidden md:block">🍎</div>
            <div class="absolute top-0 right-10 text-6xl animate-float opacity-30 hidden md:block" style="animation-delay: 1.5s">🍏</div>

            <h1 class="text-4xl md:text-6xl font-black text-slate-800 mb-4">
                Basic Addition
            </h1>
            <p class="text-xl text-slate-500 font-bold">Tap a card to solve the sum! ➕</p>
        </div>

        <!-- Addition Grid -->
        <div id="math-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 max-w-7xl mx-auto">
            <!-- Cards generated by JS -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-8 text-slate-400 font-bold">
        <p>You are a Math Wizard! 🧙‍♂️</p>
    </footer>

    <script>
        lucide.createIcons();

        const mathData = [
            { q: '1 + 1', a: '2', text: 'One plus one equals two', color: 'bg-blue-50', border: 'border-blue-300', textCol: 'text-blue-600' },
            { q: '1 + 2', a: '3', text: 'One plus two equals three', color: 'bg-green-50', border: 'border-green-300', textCol: 'text-green-600' },
            { q: '2 + 2', a: '4', text: 'Two plus two equals four', color: 'bg-yellow-50', border: 'border-yellow-300', textCol: 'text-yellow-600' },
            { q: '3 + 1', a: '4', text: 'Three plus one equals four', color: 'bg-orange-50', border: 'border-orange-300', textCol: 'text-orange-600' },
            { q: '2 + 3', a: '5', text: 'Two plus three equals five', color: 'bg-purple-50', border: 'border-purple-300', textCol: 'text-purple-600' },
            { q: '0 + 5', a: '5', text: 'Zero plus five equals five', color: 'bg-pink-50', border: 'border-pink-300', textCol: 'text-pink-600' },
            { q: '3 + 3', a: '6', text: 'Three plus three equals six', color: 'bg-teal-50', border: 'border-teal-300', textCol: 'text-teal-600' },
            { q: '4 + 2', a: '6', text: 'Four plus two equals six', color: 'bg-indigo-50', border: 'border-indigo-300', textCol: 'text-indigo-600' },
            { q: '5 + 2', a: '7', text: 'Five plus two equals seven', color: 'bg-cyan-50', border: 'border-cyan-300', textCol: 'text-cyan-600' },
            { q: '4 + 4', a: '8', text: 'Four plus four equals eight', color: 'bg-lime-50', border: 'border-lime-300', textCol: 'text-lime-600' },
            { q: '6 + 3', a: '9', text: 'Six plus three equals nine', color: 'bg-rose-50', border: 'border-rose-300', textCol: 'text-rose-600' },
            { q: '5 + 5', a: '10', text: 'Five plus five equals ten', color: 'bg-amber-50', border: 'border-amber-300', textCol: 'text-amber-600' },
        ];

        const grid = document.getElementById('math-grid');

        // Render Cards
        mathData.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = `math-card ${item.color} rounded-3xl p-8 border-b-8 ${item.border} flex flex-col items-center justify-center relative overflow-hidden group`;
            card.id = `math-${index}`;
            card.onclick = () => speak(item, index);
            
            card.innerHTML = `
                <div class="text-5xl font-black text-slate-700 mb-4 math-font tracking-wider flex items-center gap-2">
                    ${item.q} <span class="text-slate-300 transition-opacity duration-300 opacity-100 group-hover:opacity-0">= ?</span>
                </div>
                <div class="text-6xl font-black ${item.textCol} math-font opacity-0 group-hover:opacity-100 transition-all duration-300 transform translate-y-4 group-hover:translate-y-0 absolute bottom-8">
                    ${item.a}
                </div>
                <div class="absolute top-4 right-4 opacity-0 group-hover:opacity-50 transition-opacity">
                    <i data-lucide="volume-2" class="w-6 h-6 text-slate-600"></i>
                </div>
            `;
            grid.appendChild(card);
        });

        lucide.createIcons();

        // Text to Speech
        function speak(item, index) {
            if (speechSynthesis.speaking) speechSynthesis.cancel();

            const card = document.getElementById(`math-${index}`);
            document.querySelectorAll('.math-card').forEach(c => c.classList.remove('speaking'));
            card.classList.add('speaking');
            
            // Force show answer visual state
            const answerDiv = card.querySelector('.text-6xl');
            const questionSpan = card.querySelector('.text-5xl span');
            
            // Temporary visual override for mobile tap
            answerDiv.style.opacity = '1';
            answerDiv.style.transform = 'translateY(0)';
            questionSpan.style.opacity = '0';

            const utterance = new SpeechSynthesisUtterance(item.text);
            utterance.rate = 0.9;
            utterance.pitch = 1.1;

            const voices = speechSynthesis.getVoices();
            const preferredVoice = voices.find(voice => voice.name.includes('Google US English'));
            if (preferredVoice) utterance.voice = preferredVoice;
            
            utterance.onend = () => {
                card.classList.remove('speaking');
                // Reset visual override (let hover handle it)
                answerDiv.style.opacity = '';
                answerDiv.style.transform = '';
                questionSpan.style.opacity = '';
                
                triggerConfetti(card);
            };

            speechSynthesis.speak(utterance);
        }

        function triggerConfetti(element) {
            const rect = element.getBoundingClientRect();
            const x = (rect.left + rect.width / 2) / window.innerWidth;
            const y = (rect.top + rect.height / 2) / window.innerHeight;
            
            confetti({
                particleCount: 30,
                spread: 40,
                origin: { x: x, y: y },
                colors: ['#4facfe', '#ff9a9e', '#f6d365', '#84fab0'],
                disableForReducedMotion: true
            });
        }

        async function playAll() {
            for (let i = 0; i < mathData.length; i++) {
                const card = document.getElementById(`math-${i}`);
                card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                speak(mathData[i], i);
                await new Promise(r => setTimeout(r, 3000));
            }
        }
        
        window.speechSynthesis.onvoiceschanged = () => {};
    </script>
</body>
</html>
