<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparisons - Learn Opposites | Kids Zone</title>
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3e%3ctext y='28' font-size='28'%3e⚖️%3c/text%3e%3c/svg%3e">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'comic': ['"Comic Neue"', 'cursive'],
                        'sans': ['Fredoka', 'sans-serif'],
                    },
                    colors: {
                        'kid-blue': '#4facfe',
                        'kid-pink': '#ff9a9e',
                        'kid-yellow': '#f6d365',
                        'kid-green': '#84fab0',
                        'kid-purple': '#a18cd1',
                        'kid-orange': '#ffc3a0',
                        'kid-teal': '#20c997',
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Confetti JS -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body { font-family: 'Comic Neue', cursive; }
        h1, h2, h3, h4, .comp-font { font-family: 'Fredoka', sans-serif; }
        
        .comp-card {
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }
        .comp-card:hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.1);
        }
        .comp-card:active {
            transform: scale(0.95);
        }
        
        .speaking {
            background-color: #f0fdf4 !important;
            border-color: #84fab0 !important;
            transform: scale(1.05) !important;
            z-index: 10;
            box-shadow: 0 0 20px rgba(132, 250, 176, 0.6);
        }

        .animate-float { animation: float 6s ease-in-out infinite; }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body class="bg-cyan-50 text-slate-800">

    <!-- Navbar -->
    <nav class="fixed w-full z-50 bg-white/95 backdrop-blur-md border-b-4 border-kid-blue shadow-sm rounded-b-3xl">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <a href="/EDU/Kids/nursery-ukg/index.html" class="flex items-center gap-2 text-slate-600 hover:text-kid-blue transition-colors font-bold text-lg">
                <i data-lucide="arrow-left-circle" class="w-8 h-8"></i>
                Back
            </a>
            
            <span class="text-2xl font-black text-kid-blue tracking-wide">
                Learn <span class="text-kid-pink">Opposites</span>
            </span>

            <button onclick="playAll()" class="hidden md:flex items-center gap-2 px-4 py-2 bg-kid-yellow text-slate-800 rounded-full font-bold hover:bg-yellow-400 transition-colors shadow-md">
                <i data-lucide="play" class="w-5 h-5"></i> Auto Play
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto px-4 pt-28 pb-10">
        
        <!-- Header -->
        <div class="text-center mb-12 relative">
            <div class="absolute top-0 left-10 text-6xl animate-float opacity-30 hidden md:block">🦒</div>
            <div class="absolute top-0 right-10 text-6xl animate-float opacity-30 hidden md:block" style="animation-delay: 1.5s">🐈</div>

            <h1 class="text-4xl md:text-6xl font-black text-slate-800 mb-4">
                Big or Small?
            </h1>
            <p class="text-xl text-slate-500 font-bold">Tap to learn the difference! ⚖️</p>
        </div>

        <!-- Comparisons Grid -->
        <div id="comp-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 max-w-7xl mx-auto">
            <!-- Cards generated by JS -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-8 text-slate-400 font-bold">
        <p>Learning differences makes you smart! 🌟</p>
    </footer>

    <script>
        lucide.createIcons();

        const comparisonData = [
            { 
                title: 'Big & Small', 
                pair: '🐘 🐭', 
                text: 'Big Elephant and Small Mouse', 
                color: 'bg-pink-50', 
                border: 'border-pink-300', 
                textCol: 'text-pink-600' 
            },
            { 
                title: 'Tall & Short', 
                pair: '🦒 🐈', 
                text: 'Tall Giraffe and Short Cat', 
                color: 'bg-green-50', 
                border: 'border-green-300', 
                textCol: 'text-green-600' 
            },
            { 
                title: 'Hot & Cold', 
                pair: '🔥 ❄️', 
                text: 'Hot Fire and Cold Ice', 
                color: 'bg-red-50', 
                border: 'border-red-300', 
                textCol: 'text-red-600' 
            },
            { 
                title: 'Fast & Slow', 
                pair: '🐇 🐢', 
                text: 'Fast Rabbit and Slow Turtle', 
                color: 'bg-orange-50', 
                border: 'border-orange-300', 
                textCol: 'text-orange-600' 
            },
            { 
                title: 'Happy & Sad', 
                pair: '😄 😢', 
                text: 'Happy Face and Sad Face', 
                color: 'bg-yellow-50', 
                border: 'border-yellow-300', 
                textCol: 'text-yellow-600' 
            },
            { 
                title: 'Day & Night', 
                pair: '☀️ 🌙', 
                text: 'Bright Day and Dark Night', 
                color: 'bg-blue-50', 
                border: 'border-blue-300', 
                textCol: 'text-blue-600' 
            },
            { 
                title: 'Up & Down', 
                pair: '⬆️ ⬇️', 
                text: 'Arrow Up and Arrow Down', 
                color: 'bg-purple-50', 
                border: 'border-purple-300', 
                textCol: 'text-purple-600' 
            },
            { 
                title: 'Open & Closed', 
                pair: '📖 📕', 
                text: 'Open Book and Closed Book', 
                color: 'bg-teal-50', 
                border: 'border-teal-300', 
                textCol: 'text-teal-600' 
            },
            {
                title: 'Heavy & Light',
                pair: '🏋️ 🪶',
                text: 'Heavy Weight and Light Feather',
                color: 'bg-stone-50',
                border: 'border-stone-300',
                textCol: 'text-stone-600'
            },
            {
                title: 'Full & Empty',
                pair: '🥛 🥃',
                text: 'Full Glass and Empty Glass',
                color: 'bg-cyan-50',
                border: 'border-cyan-300',
                textCol: 'text-cyan-600'
            }
        ];

        const grid = document.getElementById('comp-grid');

        // Render Cards
        comparisonData.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = `comp-card ${item.color} rounded-3xl p-8 border-b-8 ${item.border} flex flex-col items-center justify-center relative overflow-hidden group`;
            card.id = `comp-${index}`;
            card.onclick = () => speak(item, index);
            
            card.innerHTML = `
                <div class="text-6xl mb-6 tracking-widest group-hover:scale-110 transition-transform duration-300 select-none">
                    ${item.pair}
                </div>
                <h3 class="text-2xl font-black text-slate-700 mb-2 comp-font ${item.textCol}">${item.title}</h3>
                <div class="absolute top-4 right-4 opacity-0 group-hover:opacity-50 transition-opacity">
                    <i data-lucide="volume-2" class="w-6 h-6 text-slate-600"></i>
                </div>
            `;
            grid.appendChild(card);
        });

        lucide.createIcons();

        // Text to Speech
        function speak(item, index) {
            if (speechSynthesis.speaking) speechSynthesis.cancel();

            const card = document.getElementById(`comp-${index}`);
            document.querySelectorAll('.comp-card').forEach(c => c.classList.remove('speaking'));
            card.classList.add('speaking');
            
            const utterance = new SpeechSynthesisUtterance(item.text);
            utterance.rate = 0.9;
            utterance.pitch = 1.1;

            const voices = speechSynthesis.getVoices();
            const preferredVoice = voices.find(voice => voice.name.includes('Google US English'));
            if (preferredVoice) utterance.voice = preferredVoice;
            
            utterance.onend = () => {
                card.classList.remove('speaking');
                if(Math.random() > 0.7) triggerConfetti(card);
            };

            speechSynthesis.speak(utterance);
        }

        function triggerConfetti(element) {
            const rect = element.getBoundingClientRect();
            const x = (rect.left + rect.width / 2) / window.innerWidth;
            const y = (rect.top + rect.height / 2) / window.innerHeight;
            
            confetti({
                particleCount: 40,
                spread: 50,
                origin: { x: x, y: y },
                colors: ['#4facfe', '#ff9a9e', '#f6d365', '#84fab0'],
                disableForReducedMotion: true
            });
        }

        async function playAll() {
            for (let i = 0; i < comparisonData.length; i++) {
                const card = document.getElementById(`comp-${i}`);
                card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                speak(comparisonData[i], i);
                await new Promise(r => setTimeout(r, 2500));
            }
        }
        
        window.speechSynthesis.onvoiceschanged = () => {};
    </script>
</body>
</html>
