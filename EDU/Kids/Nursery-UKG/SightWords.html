<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sight Words - Learn to Read | Kids Zone</title>
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3e%3ctext y='28' font-size='28'%3e👀%3c/text%3e%3c/svg%3e">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'comic': ['"Comic Neue"', 'cursive'],
                        'sans': ['Fredoka', 'sans-serif'],
                    },
                    colors: {
                        'kid-blue': '#4facfe',
                        'kid-pink': '#ff9a9e',
                        'kid-yellow': '#f6d365',
                        'kid-green': '#84fab0',
                        'kid-purple': '#a18cd1',
                        'kid-orange': '#ffc3a0',
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Confetti JS -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body { font-family: 'Comic Neue', cursive; }
        h1, h2, h3, h4, .word-font { font-family: 'Fredoka', sans-serif; }
        
        .word-card {
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }
        .word-card:hover {
            transform: scale(1.05) rotate(1deg);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .word-card:active {
            transform: scale(0.95);
        }
        
        .speaking {
            background-color: #fff9c4 !important; /* Pastel Yellow Highlight */
            border-color: #f6d365 !important;
            transform: scale(1.1) !important;
            z-index: 20;
            box-shadow: 0 0 25px rgba(246, 211, 101, 0.6);
        }

        .animate-bounce-slow {
            animation: bounce 3s infinite;
        }
    </style>
</head>
<body class="bg-indigo-50 text-slate-800">

    <!-- Navbar -->
    <nav class="fixed w-full z-50 bg-white/95 backdrop-blur-md border-b-4 border-kid-blue shadow-sm rounded-b-3xl">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <a href="/EDU/Kids/nursery-ukg/index.html" class="flex items-center gap-2 text-slate-600 hover:text-kid-blue transition-colors font-bold text-lg">
                <i data-lucide="arrow-left-circle" class="w-8 h-8"></i>
                Back
            </a>
            
            <span class="text-2xl font-black text-kid-blue tracking-wide">
                Sight <span class="text-kid-orange">Words</span>
            </span>

            <button onclick="playAll()" class="hidden md:flex items-center gap-2 px-4 py-2 bg-kid-green text-white rounded-full font-bold hover:bg-green-400 transition-colors shadow-md">
                <i data-lucide="play" class="w-5 h-5"></i> Read All
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto px-4 pt-28 pb-10">
        
        <!-- Header -->
        <div class="text-center mb-10 relative">
            <div class="absolute top-0 left-10 text-6xl animate-bounce-slow opacity-20 hidden md:block">📖</div>
            <div class="absolute bottom-0 right-10 text-6xl animate-bounce-slow opacity-20 hidden md:block" style="animation-delay: 1s">🤓</div>

            <h1 class="text-4xl md:text-6xl font-black text-slate-800 mb-2">
                Sight Words Superstars!
            </h1>
            <p class="text-xl text-slate-500 font-bold">Click a word to hear it spoken.</p>
        </div>

        <!-- Level 1: The Basics -->
        <section class="mb-12">
            <div class="flex items-center gap-2 mb-6">
                <span class="bg-kid-pink text-white px-4 py-1 rounded-full font-bold text-sm">Level 1</span>
                <h2 class="text-2xl font-bold text-slate-700">The Super Starters</h2>
            </div>
            <div id="grid-level-1" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                <!-- Generated by JS -->
            </div>
        </section>

        <!-- Level 2: Next Steps -->
        <section class="mb-12">
            <div class="flex items-center gap-2 mb-6">
                <span class="bg-kid-blue text-white px-4 py-1 rounded-full font-bold text-sm">Level 2</span>
                <h2 class="text-2xl font-bold text-slate-700">Growing Readers</h2>
            </div>
            <div id="grid-level-2" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                <!-- Generated by JS -->
            </div>
        </section>

        <!-- Level 3: Sentence Builders -->
        <section class="mb-12">
            <div class="flex items-center gap-2 mb-6">
                <span class="bg-kid-green text-white px-4 py-1 rounded-full font-bold text-sm">Level 3</span>
                <h2 class="text-2xl font-bold text-slate-700">Sentence Builders</h2>
            </div>
            <div id="grid-level-3" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                 <!-- Generated by JS -->
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="text-center py-8 text-slate-400 font-bold">
        <p>Reading makes you bright! 🌟</p>
    </footer>

    <script>
        lucide.createIcons();

        // Data separated by difficulty
        const level1 = ['the', 'and', 'a', 'to', 'is', 'in', 'it', 'you', 'that', 'he'];
        const level2 = ['was', 'for', 'on', 'are', 'as', 'with', 'his', 'they', 'I', 'at'];
        const level3 = ['be', 'this', 'have', 'from', 'or', 'one', 'had', 'by', 'word', 'but'];

        function createCard(word, containerId, colorClass, borderClass, textClass) {
            const container = document.getElementById(containerId);
            const card = document.createElement('div');
            card.className = `word-card ${colorClass} rounded-2xl p-6 border-b-4 ${borderClass} flex items-center justify-center relative overflow-hidden group shadow-sm`;
            card.id = `word-${word}`;
            card.onclick = () => speak(word);

            card.innerHTML = `
                <div class="text-3xl md:text-4xl font-black ${textClass} word-font tracking-wide">
                    ${word.toUpperCase()}
                </div>
                 <div class="absolute top-2 right-2 opacity-0 group-hover:opacity-40 transition-opacity">
                    <i data-lucide="volume-2" class="w-5 h-5 ${textClass}"></i>
                </div>
            `;
            container.appendChild(card);
        }

        // Populate Grids
        level1.forEach(w => createCard(w, 'grid-level-1', 'bg-white', 'border-kid-pink', 'text-slate-700'));
        level2.forEach(w => createCard(w, 'grid-level-2', 'bg-white', 'border-kid-blue', 'text-slate-700'));
        level3.forEach(w => createCard(w, 'grid-level-3', 'bg-white', 'border-kid-green', 'text-slate-700'));
        
        lucide.createIcons(); // Refresh icons for new elements

        // TTS Logic
        function speak(word) {
            if (speechSynthesis.speaking) speechSynthesis.cancel();

            const card = document.getElementById(`word-${word}`);
            
            // Remove speaking class from all
            document.querySelectorAll('.word-card').forEach(c => c.classList.remove('speaking'));
            
            card.classList.add('speaking');

            const utterance = new SpeechSynthesisUtterance(word);
            utterance.rate = 0.8; 
            utterance.pitch = 1.1;
            
            // Prefer a female voice if available (often clearer for kids)
            const voices = speechSynthesis.getVoices();
            const preferredVoice = voices.find(voice => voice.name.includes('Samantha') || voice.name.includes('Google US English'));
            if (preferredVoice) utterance.voice = preferredVoice;

            utterance.onend = () => {
                card.classList.remove('speaking');
                // Occasional confetti
                if(Math.random() > 0.8) triggerConfetti(card);
            };

            speechSynthesis.speak(utterance);
        }

        function triggerConfetti(element) {
            const rect = element.getBoundingClientRect();
            const x = (rect.left + rect.width / 2) / window.innerWidth;
            const y = (rect.top + rect.height / 2) / window.innerHeight;
            
            confetti({
                particleCount: 30,
                spread: 40,
                origin: { x: x, y: y },
                colors: ['#4facfe', '#ff9a9e', '#f6d365'],
                disableForReducedMotion: true
            });
        }

        async function playAll() {
            const allWords = [...level1, ...level2, ...level3];
            for (const word of allWords) {
                const card = document.getElementById(`word-${word}`);
                card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                speak(word);
                await new Promise(r => setTimeout(r, 1500));
            }
        }
        
        window.speechSynthesis.onvoiceschanged = () => {};
    </script>
</body>
</html>
