﻿﻿<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>

    <!-- Google Fonts -->

    <style>
        body { font-family: 'Comic Neue', cursive; }
        h1, h2, h3, h4, .art-font { font-family: 'Fredoka', sans-serif; }
        
        .sheet-card {
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }
        .sheet-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.1);
        }
        
        .color-btn {
            transition: transform 0.2s;
        }
        .color-btn:hover { transform: scale(1.2); }
        .color-btn.active { transform: scale(1.3); border: 2px solid #333; }

        .animate-float { animation: float 6s ease-in-out infinite; }
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        
        canvas {
            cursor: crosshair;
            touch-action: none; /* Prevent scrolling while drawing on touch devices */
        }
    </style>
</head>
<body class="bg-purple-50 text-slate-800">

    <!-- Main Content -->
    <main class="container mx-auto px-4 pt-28 pb-10">
        
        <div class="flex justify-between items-center mb-8">

            </a>
            <button onclick="clearCanvas()" class="flex items-center gap-2 px-4 py-2 bg-kid-yellow text-slate-800 rounded-full font-bold hover:bg-yellow-400 transition-colors shadow-md">
                <i data-lucide="eraser" class="w-5 h-5"></i> Clear Board
            </button>
        </div>
        
        <!-- Header -->
        <div class="text-center mb-12 relative">
            <div class="absolute top-0 left-10 text-6xl animate-float opacity-30 hidden md:block">🎨</div>
            <div class="absolute top-0 right-10 text-6xl animate-float opacity-30 hidden md:block" style="animation-delay: 1.5s">🖌️</div>

            <h1 class="text-4xl md:text-6xl font-black text-slate-800 mb-4">
                Coloring Fun!
            </h1>
            <p class="text-xl text-slate-500 font-bold">Draw, Color & Create ✨</p>
        </div>

        <!-- Interactive Drawing Board -->
        <section class="mb-20">
            <div class="bg-white rounded-3xl shadow-xl border-4 border-kid-blue p-4 max-w-5xl mx-auto">
                <div class="flex flex-col md:flex-row gap-4 items-center justify-between mb-4 px-2">
                    <h2 class="text-2xl font-black text-kid-blue flex items-center gap-2">
                        <i data-lucide="palette" class="w-6 h-6"></i> Magic Board
                    </h2>
                    
                    <!-- Tools -->
                    <div class="flex flex-wrap justify-center gap-3 bg-slate-100 p-2 rounded-full">
                        <!-- Colors -->
                        <button class="color-btn w-8 h-8 rounded-full bg-black active" onclick="setColor('black')" title="Black"></button>
                        <button class="color-btn w-8 h-8 rounded-full bg-red-500" onclick="setColor('#ef4444')" title="Red"></button>
                        <button class="color-btn w-8 h-8 rounded-full bg-orange-500" onclick="setColor('#f97316')" title="Orange"></button>
                        <button class="color-btn w-8 h-8 rounded-full bg-yellow-400" onclick="setColor('#facc15')" title="Yellow"></button>
                        <button class="color-btn w-8 h-8 rounded-full bg-green-500" onclick="setColor('#22c55e')" title="Green"></button>
                        <button class="color-btn w-8 h-8 rounded-full bg-blue-500" onclick="setColor('#3b82f6')" title="Blue"></button>
                        <button class="color-btn w-8 h-8 rounded-full bg-purple-500" onclick="setColor('#a855f7')" title="Purple"></button>
                        <button class="color-btn w-8 h-8 rounded-full bg-pink-500" onclick="setColor('#ec4899')" title="Pink"></button>
                        
                        <div class="w-px h-8 bg-slate-300 mx-1"></div>
                        
                        <!-- Eraser -->
                        <button class="color-btn w-8 h-8 rounded-full bg-white border-2 border-slate-300 flex items-center justify-center" onclick="setEraser()" title="Eraser">
                            <i data-lucide="eraser" class="w-4 h-4 text-slate-600"></i>
                        </button>
                    </div>

                    <button onclick="downloadDrawing()" class="px-4 py-2 bg-kid-green text-white rounded-full font-bold hover:bg-green-400 transition-colors shadow-sm text-sm flex items-center gap-2">
                        <i data-lucide="download" class="w-4 h-4"></i> Save
                    </button>
                </div>

                <div class="relative w-full h-[400px] md:h-[500px] bg-white rounded-2xl border-2 border-dashed border-slate-200 overflow-hidden cursor-crosshair touch-none">
                    <canvas id="drawing-canvas" class="w-full h-full"></canvas>
                    <div id="canvas-placeholder" class="absolute inset-0 flex items-center justify-center pointer-events-none text-slate-300 font-bold text-2xl opacity-50">
                        Start Drawing Here!
                    </div>
                </div>
            </div>
        </section>

        <!-- Printable Sheets -->
        <section>
            <div class="text-center mb-10">
                <h2 class="text-3xl font-black text-slate-700 mb-2">Printable Sheets</h2>
                <p class="text-slate-500 font-bold">Download and color with crayons! 🖍️</p>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 max-w-6xl mx-auto">
                <!-- Sheet 1 -->
                <div class="sheet-card bg-white p-6 rounded-3xl shadow-lg border-b-8 border-pink-300 group">
                    <div class="aspect-[3/4] bg-white border-2 border-slate-100 rounded-xl mb-4 flex items-center justify-center p-4">
                        <!-- SVG Placeholder for coloring sheet -->
                        <svg viewBox="0 0 100 100" class="w-full h-full text-slate-800" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="50" cy="50" r="30" />
                            <path d="M50 20 L50 10 M50 80 L50 90 M20 50 L10 50 M80 50 L90 50 M29 29 L22 22 M71 71 L78 78 M29 71 L22 78 M71 29 L78 22" />
                            <circle cx="40" cy="45" r="2" fill="currentColor"/>
                            <circle cx="60" cy="45" r="2" fill="currentColor"/>
                            <path d="M40 60 Q50 70 60 60" />
                        </svg>
                    </div>
                    <div class="flex justify-between items-center">
                        <h3 class="text-xl font-bold text-pink-500">Mr. Sun</h3>
                        <button class="p-2 bg-pink-100 text-pink-500 rounded-full hover:bg-pink-200 transition-colors" title="Download">
                            <i data-lucide="download" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>

                <!-- Sheet 2 -->
                <div class="sheet-card bg-white p-6 rounded-3xl shadow-lg border-b-8 border-green-300 group">
                     <div class="aspect-[3/4] bg-white border-2 border-slate-100 rounded-xl mb-4 flex items-center justify-center p-4">
                        <svg viewBox="0 0 100 100" class="w-full h-full text-slate-800" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="25" y="40" width="50" height="40" />
                            <path d="M20 40 L50 15 L80 40 Z" />
                            <rect x="42" y="60" width="16" height="20" />
                            <rect x="30" y="45" width="10" height="10" />
                            <rect x="60" y="45" width="10" height="10" />
                        </svg>
                    </div>
                    <div class="flex justify-between items-center">
                        <h3 class="text-xl font-bold text-green-500">My House</h3>
                        <button class="p-2 bg-green-100 text-green-500 rounded-full hover:bg-green-200 transition-colors" title="Download">
                            <i data-lucide="download" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>

                <!-- Sheet 3 -->
                <div class="sheet-card bg-white p-6 rounded-3xl shadow-lg border-b-8 border-orange-300 group">
                     <div class="aspect-[3/4] bg-white border-2 border-slate-100 rounded-xl mb-4 flex items-center justify-center p-4">
                        <svg viewBox="0 0 100 100" class="w-full h-full text-slate-800" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M50 20 Q80 20 80 50 Q80 80 50 80 Q20 80 20 50 Q20 20 50 20 Z" />
                            <path d="M50 20 L50 10 M40 10 L60 10" />
                            <path d="M50 80 L55 90 L60 85" />
                        </svg>
                    </div>
                    <div class="flex justify-between items-center">
                        <h3 class="text-xl font-bold text-orange-500">Juicy Apple</h3>
                        <button class="p-2 bg-orange-100 text-orange-500 rounded-full hover:bg-orange-200 transition-colors" title="Download">
                            <i data-lucide="download" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <script>
        lucide.createIcons();

        // Canvas Drawing Logic
        const canvas = document.getElementById('drawing-canvas');
        const ctx = canvas.getContext('2d');
        const placeholder = document.getElementById('canvas-placeholder');
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        let currentColor = 'black';
        let brushSize = 5;

        // Resize canvas to fit container
        function resizeCanvas() {
            const parent = canvas.parentElement;
            canvas.width = parent.offsetWidth;
            canvas.height = parent.offsetHeight;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
        }
        
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function startDrawing(e) {
            isDrawing = true;
            placeholder.style.display = 'none';
            [lastX, lastY] = getCoordinates(e);
        }

        function draw(e) {
            if (!isDrawing) return;
            const [x, y] = getCoordinates(e);
            
            ctx.strokeStyle = currentColor;
            ctx.lineWidth = brushSize;
            
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.stroke();
            
            [lastX, lastY] = [x, y];
        }

        function stopDrawing() {
            isDrawing = false;
        }
        
        function getCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return [clientX - rect.left, clientY - rect.top];
        }

        // Event Listeners
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);
        
        // Touch support
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e); }, { passive: false });
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); }, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);

        // Tools
        function setColor(color) {
            currentColor = color;
            brushSize = 5; // Reset brush size for drawing
            updateActiveButton(color);
        }

        function setEraser() {
            currentColor = '#ffffff'; // Assuming white background
            brushSize = 20;
            // Highlight eraser button
            document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector('button[title="Eraser"]').classList.add('active');
        }
        
        function updateActiveButton(color) {
            document.querySelectorAll('.color-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.getAttribute('onclick').includes(color)) {
                    btn.classList.add('active');
                }
            });
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            placeholder.style.display = 'flex';
            // Celebration
            confetti({
                particleCount: 50,
                spread: 70,
                origin: { y: 0.6 }
            });
        }

        function downloadDrawing() {
            const link = document.createElement('a');
            link.download = 'my-masterpiece.png';
            link.href = canvas.toDataURL();
            link.click();
        }
    </script>
</body>
</html>
