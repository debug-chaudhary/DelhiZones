<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hindi Vyanjan - Learn Consonants | Kids Zone</title>
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3e%3ctext y='28' font-size='28'%3e🕉️%3c/text%3e%3c/svg%3e">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'comic': ['"Comic Neue"', 'cursive'],
                        'hindi': ['"Noto Sans Devanagari"', 'sans-serif'],
                    },
                    colors: {
                        'kid-orange': '#ffc3a0',
                        'kid-yellow': '#f6d365',
                        'kid-green': '#84fab0',
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Confetti JS -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body { font-family: 'Comic Neue', cursive; }
        .hindi-font { font-family: 'Noto Sans Devanagari', sans-serif; }
        
        .vyanjan-card {
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }
        .vyanjan-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 15px 30px -5px rgba(255, 165, 0, 0.2);
        }
        .vyanjan-card:active {
            transform: scale(0.95);
        }
        
        .speaking {
            border-color: #f6d365 !important;
            background-color: #fff9c4 !important;
            transform: scale(1.05) !important;
            z-index: 10;
            box-shadow: 0 0 20px rgba(246, 211, 101, 0.6);
        }

        .animate-float { animation: float 6s ease-in-out infinite; }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body class="bg-orange-50 text-slate-800">

    <!-- Navbar -->
    <nav class="fixed w-full z-50 bg-white/95 backdrop-blur-md border-b-4 border-orange-400 shadow-sm rounded-b-3xl">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <a href="/EDU/Kids/nursery-ukg/index.html" class="flex items-center gap-2 text-slate-600 hover:text-orange-500 transition-colors font-bold text-lg">
                <i data-lucide="arrow-left-circle" class="w-8 h-8"></i>
                Back
            </a>
            
            <span class="text-2xl font-black text-orange-500 tracking-wide hindi-font">
                हिंदी <span class="text-yellow-500">व्यंजन</span>
            </span>

            <button onclick="playAll()" class="hidden md:flex items-center gap-2 px-4 py-2 bg-orange-500 text-white rounded-full font-bold hover:bg-orange-600 transition-colors shadow-md">
                <i data-lucide="play" class="w-5 h-5"></i> Auto Play
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto px-4 pt-28 pb-10">
        
        <!-- Header -->
        <div class="text-center mb-12 relative">
            <div class="absolute top-0 left-10 text-6xl animate-float opacity-30 hidden md:block">🪁</div>
            <div class="absolute top-0 right-10 text-6xl animate-float opacity-30 hidden md:block" style="animation-delay: 1.5s">🦜</div>

            <h1 class="text-4xl md:text-6xl font-black text-slate-800 mb-4 hindi-font">
                व्यंजन माला (Consonants)
            </h1>
            <p class="text-xl text-slate-500 font-bold">Click to listen and learn! 👂</p>
        </div>

        <!-- Vyanjan Grid -->
        <div id="vyanjan-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6 max-w-6xl mx-auto">
            <!-- Cards generated by JS -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-8 text-slate-400 font-bold">
        <p>हिंदी हमारी शान है! 🇮🇳</p>
    </footer>

    <script>
        lucide.createIcons();

        const vyanjanData = [
            { letter: 'क', word: 'कबूतर', eng: 'Pigeon', emoji: '🕊️', soundText: 'क से कबूतर' },
            { letter: 'ख', word: 'खरगोश', eng: 'Rabbit', emoji: '🐇', soundText: 'ख से खरगोश' },
            { letter: 'ग', word: 'गमला', eng: 'Flower Pot', emoji: '🪴', soundText: 'ग से गमला' },
            { letter: 'घ', word: 'घर', eng: 'House', emoji: '🏠', soundText: 'घ से घर' },
            { letter: 'ङ', word: 'खाली', eng: 'Empty', emoji: '⭕', soundText: 'ङ खाली' },
            { letter: 'च', word: 'चम्मच', eng: 'Spoon', emoji: '🥄', soundText: 'च से चम्मच' },
            { letter: 'छ', word: 'छतरी', eng: 'Umbrella', emoji: '☂️', soundText: 'छ से छतरी' },
            { letter: 'ज', word: 'जहाज', eng: 'Ship', emoji: '🚢', soundText: 'ज से जहाज' },
            { letter: 'झ', word: 'झंडा', eng: 'Flag', emoji: '🇮🇳', soundText: 'झ से झंडा' },
            { letter: 'ञ', word: 'खाली', eng: 'Empty', emoji: '⭕', soundText: 'ञ खाली' },
            { letter: 'ट', word: 'टमाटर', eng: 'Tomato', emoji: '🍅', soundText: 'ट से टमाटर' },
            { letter: 'ठ', word: 'ठठेरा', eng: 'Smith', emoji: '🔨', soundText: 'ठ से ठठेरा' },
            { letter: 'ड', word: 'डमरू', eng: 'Drum', emoji: '🥁', soundText: 'ड से डमरू' },
            { letter: 'ढ', word: 'ढक्कन', eng: 'Lid', emoji: '🥘', soundText: 'ढ से ढक्कन' },
            { letter: 'ण', word: 'खाली', eng: 'Empty', emoji: '⭕', soundText: 'ण खाली' },
            { letter: 'त', word: 'तरबूज', eng: 'Watermelon', emoji: '🍉', soundText: 'त से तरबूज' },
            { letter: 'थ', word: 'थर्मस', eng: 'Thermos', emoji: '🍶', soundText: 'थ से थर्मस' },
            { letter: 'द', word: 'दवात', eng: 'Inkpot', emoji: '✒️', soundText: 'द से दवात' },
            { letter: 'ध', word: 'धनुष', eng: 'Bow', emoji: '🏹', soundText: 'ध से धनुष' },
            { letter: 'न', word: 'नल', eng: 'Tap', emoji: '🚰', soundText: 'न से नल' },
            { letter: 'प', word: 'पतंग', eng: 'Kite', emoji: '🪁', soundText: 'प से पतंग' },
            { letter: 'फ', word: 'फल', eng: 'Fruit', emoji: '🍎', soundText: 'फ से फल' },
            { letter: 'ब', word: 'बत्तख', eng: 'Duck', emoji: '🦆', soundText: 'ब से बत्तख' },
            { letter: 'भ', word: 'भालू', eng: 'Bear', emoji: '🐻', soundText: 'भ से भालू' },
            { letter: 'म', word: 'मछली', eng: 'Fish', emoji: '🐟', soundText: 'म से मछली' },
            { letter: 'य', word: 'यज्ञ', eng: 'Yagna', emoji: '🔥', soundText: 'य से यज्ञ' },
            { letter: 'र', word: 'रथ', eng: 'Chariot', emoji: '🐎', soundText: 'र से रथ' },
            { letter: 'ल', word: 'लट्टू', eng: 'Top', emoji: '🌪️', soundText: 'ल से लट्टू' },
            { letter: 'व', word: 'वक', eng: 'Crane', emoji: '🦢', soundText: 'व से वक' },
            { letter: 'श', word: 'शलजम', eng: 'Turnip', emoji: '🥬', soundText: 'श से शलजम' },
            { letter: 'ष', word: 'षट्कोण', eng: 'Hexagon', emoji: '🛑', soundText: 'ष से षट्कोण' },
            { letter: 'स', word: 'सपेरा', eng: 'Snake Charmer', emoji: '🐍', soundText: 'स से सपेरा' },
            { letter: 'ह', word: 'हाथी', eng: 'Elephant', emoji: '🐘', soundText: 'ह से हाथी' },
            { letter: 'क्ष', word: 'क्षत्रिय', eng: 'Warrior', emoji: '⚔️', soundText: 'क्ष से क्षत्रिय' },
            { letter: 'त्र', word: 'त्रिशूल', eng: 'Trident', emoji: '🔱', soundText: 'त्र से त्रिशूल' },
            { letter: 'ज्ञ', word: 'ज्ञानी', eng: 'Scholar', emoji: '🧘', soundText: 'ज्ञ से ज्ञानी' }
        ];

        const grid = document.getElementById('vyanjan-grid');

        // Render Cards
        vyanjanData.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = `vyanjan-card bg-white rounded-3xl p-6 border-b-8 border-orange-200 flex flex-col items-center justify-center relative overflow-hidden group`;
            card.id = `vyanjan-${index}`;
            card.onclick = () => speak(item, index);
            
            card.innerHTML = `
                <div class="text-6xl md:text-8xl font-bold text-orange-500 hindi-font mb-4 transition-transform group-hover:scale-110">
                    ${item.letter}
                </div>
                <div class="text-5xl mb-2 group-hover:animate-bounce cursor-pointer select-none">${item.emoji}</div>
                <div class="text-2xl font-bold text-slate-700 hindi-font">${item.word}</div>
                <div class="text-sm font-bold text-slate-400 uppercase tracking-wide mt-1">${item.eng}</div>
                
                <div class="absolute top-2 right-2 opacity-20 group-hover:opacity-100 transition-opacity">
                    <i data-lucide="volume-2" class="w-6 h-6 text-orange-400"></i>
                </div>
            `;
            grid.appendChild(card);
        });

        lucide.createIcons();

        // Text to Speech
        function speak(item, index) {
            if (speechSynthesis.speaking) speechSynthesis.cancel();

            const card = document.getElementById(`vyanjan-${index}`);
            document.querySelectorAll('.vyanjan-card').forEach(c => c.classList.remove('speaking'));
            card.classList.add('speaking');
            
            const utterance = new SpeechSynthesisUtterance(item.soundText);
            utterance.lang = 'hi-IN'; // Set language to Hindi
            utterance.rate = 0.8;
            
            utterance.onend = () => {
                card.classList.remove('speaking');
                if(Math.random() > 0.8) triggerConfetti(card);
            };

            speechSynthesis.speak(utterance);
        }

        function triggerConfetti(element) {
            const rect = element.getBoundingClientRect();
            const x = (rect.left + rect.width / 2) / window.innerWidth;
            const y = (rect.top + rect.height / 2) / window.innerHeight;
            
            confetti({
                particleCount: 40,
                spread: 50,
                origin: { x: x, y: y },
                colors: ['#ff9a9e', '#f6d365', '#ffc3a0', '#84fab0'],
                disableForReducedMotion: true
            });
        }

        async function playAll() {
            for (let i = 0; i < vyanjanData.length; i++) {
                const card = document.getElementById(`vyanjan-${i}`);
                card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                speak(vyanjanData[i], i);
                await new Promise(r => setTimeout(r, 2500));
            }
        }
    </script>
</body>
</html>
