<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phonics Fun - Learn Sounds | Kids Zone</title>
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3e%3ctext y='28' font-size='28'%3e🔊%3c/text%3e%3c/svg%3e">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'comic': ['"Comic Neue"', 'cursive'],
                        'sans': ['Fredoka', 'sans-serif'],
                    },
                    colors: {
                        'kid-blue': '#4facfe',
                        'kid-pink': '#ff9a9e',
                        'kid-yellow': '#f6d365',
                        'kid-green': '#84fab0',
                        'kid-purple': '#a18cd1',
                        'kid-orange': '#ffc3a0',
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Confetti JS -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body { font-family: 'Comic Neue', cursive; }
        h1, h2, h3, h4, .phonic-font { font-family: 'Fredoka', sans-serif; }
        
        .phonic-card {
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }
        .phonic-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.1);
        }
        .phonic-card:active {
            transform: scale(0.95);
        }
        
        .speaking {
            border-color: #84fab0 !important;
            background-color: #f0fff4 !important;
            transform: scale(1.05) !important;
            z-index: 10;
            box-shadow: 0 0 20px rgba(132, 250, 176, 0.6);
        }

        /* Animations */
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        .animate-float { animation: float 5s ease-in-out infinite; }
    </style>
</head>
<body class="bg-green-50 text-slate-800">

    <!-- Navbar -->
    <nav class="fixed w-full z-50 bg-white/95 backdrop-blur-md border-b-4 border-kid-green shadow-sm rounded-b-3xl">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <a href="/EDU/Kids/nursery-ukg/index.html" class="flex items-center gap-2 text-slate-600 hover:text-kid-green transition-colors font-bold text-lg">
                <i data-lucide="arrow-left-circle" class="w-8 h-8"></i>
                Back
            </a>
            
            <span class="text-2xl font-black text-kid-green tracking-wide">
                Phonics <span class="text-kid-purple">Fun</span>
            </span>

            <button onclick="playAll()" class="hidden md:flex items-center gap-2 px-4 py-2 bg-kid-yellow text-slate-800 rounded-full font-bold hover:bg-yellow-400 transition-colors shadow-md">
                <i data-lucide="play" class="w-5 h-5"></i> Play All
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto px-4 pt-28 pb-10">
        
        <!-- Header -->
        <div class="text-center mb-12 relative">
            <div class="absolute top-0 left-4 md:left-20 text-6xl animate-float opacity-30">👂</div>
            <div class="absolute top-0 right-4 md:right-20 text-6xl animate-float opacity-30" style="animation-delay: 1.5s">🗣️</div>

            <h1 class="text-5xl md:text-6xl font-black text-slate-800 mb-4">
                Listen & Say!
            </h1>
            <p class="text-xl text-slate-500 font-bold">Tap a card to hear the sound 🎵</p>
        </div>

        <!-- Phonics Grid -->
        <div id="phonics-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 max-w-7xl mx-auto">
            <!-- Cards generated by JS -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-8 text-slate-400 font-bold">
        <p>Sounds make words come alive! ✨</p>
    </footer>

    <script>
        lucide.createIcons();

        // Phonics Data: Letter, Word, Sound Hint (visual), Pronunciation Text
        // Note: Pronunciation text is tweaked for better TTS results.
        const phonicsData = [
            { letter: 'A', word: 'Apple', sound: 'ah', text: 'A says ah, like Apple', emoji: '🍎', color: 'bg-red-50', border: 'border-red-300', textCol: 'text-red-600' },
            { letter: 'B', word: 'Ball', sound: 'buh', text: 'B says buh, like Ball', emoji: '⚽', color: 'bg-blue-50', border: 'border-blue-300', textCol: 'text-blue-600' },
            { letter: 'C', word: 'Cat', sound: 'kuh', text: 'C says kuh, like Cat', emoji: '🐱', color: 'bg-yellow-50', border: 'border-yellow-300', textCol: 'text-yellow-600' },
            { letter: 'D', word: 'Dog', sound: 'duh', text: 'D says duh, like Dog', emoji: '🐶', color: 'bg-orange-50', border: 'border-orange-300', textCol: 'text-orange-600' },
            { letter: 'E', word: 'Egg', sound: 'eh', text: 'E says eh, like Egg', emoji: '🥚', color: 'bg-stone-50', border: 'border-stone-300', textCol: 'text-stone-600' },
            { letter: 'F', word: 'Fish', sound: 'fff', text: 'F says fff, like Fish', emoji: '🐟', color: 'bg-cyan-50', border: 'border-cyan-300', textCol: 'text-cyan-600' },
            { letter: 'G', word: 'Goat', sound: 'guh', text: 'G says guh, like Goat', emoji: '🐐', color: 'bg-green-50', border: 'border-green-300', textCol: 'text-green-600' },
            { letter: 'H', word: 'Hat', sound: 'huh', text: 'H says huh, like Hat', emoji: '👒', color: 'bg-purple-50', border: 'border-purple-300', textCol: 'text-purple-600' },
            { letter: 'I', word: 'Igloo', sound: 'ih', text: 'I says ih, like Igloo', emoji: '🏠', color: 'bg-sky-50', border: 'border-sky-300', textCol: 'text-sky-600' },
            { letter: 'J', word: 'Jam', sound: 'juh', text: 'J says juh, like Jam', emoji: '🍯', color: 'bg-red-50', border: 'border-red-300', textCol: 'text-red-600' },
            { letter: 'K', word: 'Kite', sound: 'kuh', text: 'K says kuh, like Kite', emoji: '🪁', color: 'bg-indigo-50', border: 'border-indigo-300', textCol: 'text-indigo-600' },
            { letter: 'L', word: 'Lion', sound: 'lll', text: 'L says lll, like Lion', emoji: '🦁', color: 'bg-amber-50', border: 'border-amber-300', textCol: 'text-amber-600' },
            { letter: 'M', word: 'Moon', sound: 'mmm', text: 'M says mmm, like Moon', emoji: '🌙', color: 'bg-slate-50', border: 'border-slate-300', textCol: 'text-slate-600' },
            { letter: 'N', word: 'Nest', sound: 'nnn', text: 'N says nnn, like Nest', emoji: '🪺', color: 'bg-emerald-50', border: 'border-emerald-300', textCol: 'text-emerald-600' },
            { letter: 'O', word: 'Owl', sound: 'aw', text: 'O says aw, like Owl', emoji: '🦉', color: 'bg-orange-50', border: 'border-orange-300', textCol: 'text-orange-600' },
            { letter: 'P', word: 'Pig', sound: 'puh', text: 'P says puh, like Pig', emoji: '🐷', color: 'bg-pink-50', border: 'border-pink-300', textCol: 'text-pink-600' },
            { letter: 'Q', word: 'Queen', sound: 'kwuh', text: 'Q says kwuh, like Queen', emoji: '👑', color: 'bg-violet-50', border: 'border-violet-300', textCol: 'text-violet-600' },
            { letter: 'R', word: 'Rat', sound: 'rrr', text: 'R says rrr, like Rat', emoji: '🐀', color: 'bg-gray-50', border: 'border-gray-300', textCol: 'text-gray-600' },
            { letter: 'S', word: 'Sun', sound: 'sss', text: 'S says sss, like Sun', emoji: '☀️', color: 'bg-yellow-50', border: 'border-yellow-300', textCol: 'text-yellow-600' },
            { letter: 'T', word: 'Top', sound: 'tuh', text: 'T says tuh, like Top', emoji: '🌪️', color: 'bg-teal-50', border: 'border-teal-300', textCol: 'text-teal-600' },
            { letter: 'U', word: 'Umbrella', sound: 'uh', text: 'U says uh, like Umbrella', emoji: '☂️', color: 'bg-blue-50', border: 'border-blue-300', textCol: 'text-blue-600' },
            { letter: 'V', word: 'Van', sound: 'vvv', text: 'V says vvv, like Van', emoji: '🚐', color: 'bg-fuchsia-50', border: 'border-fuchsia-300', textCol: 'text-fuchsia-600' },
            { letter: 'W', word: 'Watch', sound: 'wuh', text: 'W says wuh, like Watch', emoji: '⌚', color: 'bg-cyan-50', border: 'border-cyan-300', textCol: 'text-cyan-600' },
            { letter: 'X', word: 'X-ray', sound: 'ks', text: 'X says ks, like X-ray', emoji: '🦴', color: 'bg-slate-100', border: 'border-slate-300', textCol: 'text-slate-600' },
            { letter: 'Y', word: 'Yo-yo', sound: 'yuh', text: 'Y says yuh, like Yo-yo', emoji: '🪀', color: 'bg-rose-50', border: 'border-rose-300', textCol: 'text-rose-600' },
            { letter: 'Z', word: 'Zip', sound: 'zzz', text: 'Z says zzz, like Zip', emoji: '🤐', color: 'bg-lime-50', border: 'border-lime-300', textCol: 'text-lime-600' }
        ];

        const grid = document.getElementById('phonics-grid');

        // Generate Cards
        phonicsData.forEach(item => {
            const card = document.createElement('div');
            card.className = `phonic-card ${item.color} rounded-2xl p-6 border-b-4 ${item.border} flex items-center justify-between relative overflow-hidden group`;
            card.id = `phonic-${item.letter}`;
            card.onclick = () => speak(item);
            
            card.innerHTML = `
                <div class="flex items-center gap-4">
                    <div class="text-5xl font-black ${item.textCol} phonic-font w-16 text-center">
                        ${item.letter}
                    </div>
                    <div class="text-left">
                        <div class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-1">Sound</div>
                        <div class="text-2xl font-bold text-slate-700">/${item.sound}/</div>
                    </div>
                </div>
                <div class="text-5xl group-hover:scale-125 transition-transform duration-300">
                    ${item.emoji}
                </div>
                <div class="absolute inset-0 border-2 border-transparent group-hover:border-white/50 rounded-2xl pointer-events-none"></div>
            `;
            grid.appendChild(card);
        });
        
        lucide.createIcons();

        // Text to Speech Function
        function speak(item) {
            if (speechSynthesis.speaking) {
                speechSynthesis.cancel();
            }

            const card = document.getElementById(`phonic-${item.letter}`);
            document.querySelectorAll('.phonic-card').forEach(c => c.classList.remove('speaking'));
            card.classList.add('speaking');
            
            const utterance = new SpeechSynthesisUtterance(item.text);
            utterance.rate = 0.8; // Slow down for clarity
            utterance.pitch = 1.1; 
            
            // Voice preference
            const voices = speechSynthesis.getVoices();
            // Try to find a clear English voice
            const preferredVoice = voices.find(voice => 
                voice.lang.includes('en-US') || voice.lang.includes('en-GB')
            );
            if (preferredVoice) utterance.voice = preferredVoice;

            utterance.onend = () => {
                card.classList.remove('speaking');
                // Small confetti burst
                const rect = card.getBoundingClientRect();
                confetti({
                    particleCount: 30,
                    spread: 50,
                    origin: { 
                        x: (rect.left + rect.width / 2) / window.innerWidth, 
                        y: (rect.top + rect.height / 2) / window.innerHeight 
                    },
                    colors: ['#84fab0', '#a18cd1', '#ff9a9e'],
                    disableForReducedMotion: true
                });
            };

            speechSynthesis.speak(utterance);
        }

        // Auto Play function
        async function playAll() {
            for (const item of phonicsData) {
                const card = document.getElementById(`phonic-${item.letter}`);
                card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                speak(item);
                // Wait approx 3 seconds
                await new Promise(r => setTimeout(r, 3000));
            }
        }
        
        // Ensure voices loaded
        window.speechSynthesis.onvoiceschanged = () => {};
    </script>
</body>
</html>
