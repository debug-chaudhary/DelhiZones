<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hindi Kavita - Sing Along | Kids Zone</title>
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3e%3ctext y='28' font-size='28'%3e🎶%3c/text%3e%3c/svg%3e">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'comic': ['"Comic Neue"', 'cursive'],
                        'hindi': ['"Noto Sans Devanagari"', 'sans-serif'],
                    },
                    colors: {
                        'kid-blue': '#4facfe',
                        'kid-pink': '#ff9a9e',
                        'kid-yellow': '#f6d365',
                        'kid-green': '#84fab0',
                        'kid-purple': '#a18cd1',
                        'kid-orange': '#ffc3a0',
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Comic Neue', cursive; }
        .hindi-font { font-family: 'Noto Sans Devanagari', sans-serif; }
        
        .kavita-card {
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }
        .kavita-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.1);
        }
        
        /* Modal Animation */
        .modal-enter { opacity: 0; transform: scale(0.9); }
        .modal-enter-active { opacity: 1; transform: scale(1); transition: all 0.3s ease-out; }
        
        .animate-float { animation: float 6s ease-in-out infinite; }
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
    </style>
</head>
<body class="bg-orange-50 text-slate-800">

    <!-- Navbar -->
    <nav class="fixed w-full z-50 bg-white/95 backdrop-blur-md border-b-4 border-kid-orange shadow-sm rounded-b-3xl">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <a href="/EDU/Kids/nursery-ukg/index.html" class="flex items-center gap-2 text-slate-600 hover:text-orange-500 transition-colors font-bold text-lg">
                <i data-lucide="arrow-left-circle" class="w-8 h-8"></i>
                Back
            </a>
            
            <span class="text-2xl font-black text-orange-500 tracking-wide hindi-font">
                बाल <span class="text-yellow-500">गीत</span>
            </span>

            <div class="w-8"></div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto px-4 pt-28 pb-10">
        
        <!-- Header -->
        <div class="text-center mb-12 relative">
            <div class="absolute top-0 left-10 text-6xl animate-float opacity-30 hidden md:block">🥁</div>
            <div class="absolute top-0 right-10 text-6xl animate-float opacity-30 hidden md:block" style="animation-delay: 1.5s">🎭</div>

            <h1 class="text-4xl md:text-6xl font-black text-slate-800 mb-4 hindi-font">
                मजेदार कविताएँ
            </h1>
            <p class="text-xl text-slate-500 font-bold">Pick a poem and sing along! 🎶</p>
        </div>

        <!-- Kavita Grid -->
        <div id="kavita-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 max-w-6xl mx-auto">
            <!-- Cards generated by JS -->
        </div>

    </main>

    <!-- Lyrics Modal -->
    <div id="lyrics-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
        <div class="bg-white rounded-3xl w-full max-w-2xl max-h-[90vh] overflow-y-auto shadow-2xl relative border-4 border-kid-yellow">
            <button onclick="closeModal()" class="absolute top-4 right-4 p-2 bg-slate-100 rounded-full hover:bg-red-100 hover:text-red-500 transition-colors">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
            
            <div class="p-8 text-center">
                <div class="text-6xl mb-4" id="modal-emoji"></div>
                <h2 class="text-3xl font-black text-slate-800 mb-6 hindi-font" id="modal-title"></h2>
                
                <div class="bg-yellow-50 p-6 rounded-2xl border-2 border-yellow-100 mb-8">
                    <p class="text-xl md:text-2xl leading-relaxed hindi-font text-slate-700 whitespace-pre-line" id="modal-lyrics"></p>
                </div>
                
                <div class="flex justify-center gap-4">
                    <button onclick="readLyrics()" class="flex items-center gap-2 px-8 py-3 bg-orange-500 text-white rounded-full font-bold text-lg hover:bg-orange-600 shadow-lg hover:-translate-y-1 transition-all">
                        <i data-lucide="volume-2" class="w-6 h-6"></i> Read Aloud
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center py-8 text-slate-400 font-bold">
        <p>कविता याद करो! ✨</p>
    </footer>

    <script>
        lucide.createIcons();

        const kavitaData = [
            {
                title: "मछली जल की रानी है",
                emoji: "🐟",
                color: "bg-blue-50",
                border: "border-blue-300",
                text: "text-blue-600",
                lyrics: "मछली जल की रानी है,\nजीवन उसका पानी है।\nहाथ लगाओगे तो डर जाएगी,\nबाहर निकालोगे तो मर जाएगी।"
            },
            {
                title: "आलू कचालू बेटा",
                emoji: "🥔",
                color: "bg-orange-50",
                border: "border-orange-300",
                text: "text-orange-600",
                lyrics: "आलू कचालू बेटा कहाँ गए थे,\nबैंगन की टोकरी में सो रहे थे।\nबैंगन ने लात मारी रो रहे थे,\nमम्मी ने प्यार किया हँस रहे थे,\nपापा ने पैसे दिए नाच रहे थे।"
            },
            {
                title: "लकड़ी की काठी",
                emoji: "🐎",
                color: "bg-red-50",
                border: "border-red-300",
                text: "text-red-600",
                lyrics: "लकड़ी की काठी, काठी पे घोड़ा,\nघोड़े की दुम पे जो मारा हथौड़ा।\nदौड़ा दौड़ा दौड़ा घोड़ा,\nदुम उठा के दौड़ा।"
            },
            {
                title: "चंदा मामा दूर के",
                emoji: "🌙",
                color: "bg-indigo-50",
                border: "border-indigo-300",
                text: "text-indigo-600",
                lyrics: "चंदा मामा दूर के,\nपूए पकाएं बूर के।\nआप खाएं थाली में,\nमुन्ने को दें प्याली में।"
            },
            {
                title: "हाथी राजा कहाँ चले",
                emoji: "🐘",
                color: "bg-stone-100",
                border: "border-stone-300",
                text: "text-stone-600",
                lyrics: "हाथी राजा कहाँ चले,\nसूंढ हिलाकर कहाँ चले।\nमेरे घर भी आओ ना,\nहलवा पूरी खाओ ना।"
            },
            {
                title: "ऊपर पंखा चलता है",
                emoji: "🌀",
                color: "bg-cyan-50",
                border: "border-cyan-300",
                text: "text-cyan-600",
                lyrics: "ऊपर पंखा चलता है,\nनीचे बेबी सोता है।\nसोते-सोते भूख लगी,\nखा ले बेटा मूंगफली।"
            }
        ];

        const grid = document.getElementById('kavita-grid');
        const modal = document.getElementById('lyrics-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalLyrics = document.getElementById('modal-lyrics');
        const modalEmoji = document.getElementById('modal-emoji');

        // Render Cards
        kavitaData.forEach((kavita, index) => {
            const card = document.createElement('div');
            card.className = `kavita-card ${kavita.color} rounded-3xl p-6 border-b-8 ${kavita.border} flex flex-col items-center text-center group relative overflow-hidden`;
            card.onclick = () => openModal(index);
            
            card.innerHTML = `
                <div class="text-7xl mb-4 transform group-hover:scale-110 transition-transform duration-300">${kavita.emoji}</div>
                <h3 class="text-2xl font-black ${kavita.text} mb-2 hindi-font">${kavita.title}</h3>
                <p class="text-slate-500 font-bold text-sm">Click to Read</p>
                <div class="absolute inset-0 bg-white/20 opacity-0 group-hover:opacity-100 transition-opacity"></div>
            `;
            grid.appendChild(card);
        });

        // Modal Functions
        function openModal(index) {
            const kavita = kavitaData[index];
            modalTitle.innerText = kavita.title;
            modalLyrics.innerText = kavita.lyrics;
            modalEmoji.innerText = kavita.emoji;
            modal.classList.remove('hidden');
            
            const content = modal.querySelector('div');
            content.classList.remove('modal-enter', 'modal-enter-active');
            void content.offsetWidth; // trigger reflow
            content.classList.add('modal-enter');
            requestAnimationFrame(() => content.classList.add('modal-enter-active'));
        }

        function closeModal() {
            if (speechSynthesis.speaking) speechSynthesis.cancel();
            modal.classList.add('hidden');
        }

        // TTS
        function readLyrics() {
            if (speechSynthesis.speaking) speechSynthesis.cancel();

            const text = modalLyrics.innerText;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'hi-IN'; // Hindi
            utterance.rate = 0.85; 
            utterance.pitch = 1.1; 
            
            speechSynthesis.speak(utterance);
        }

        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });
    </script>
</body>
</html>
