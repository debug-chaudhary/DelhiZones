<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    
    <title>Delhi Jobs Portal 2026 | Govt (Sarkari) & Private Vacancies</title>
    <meta name="description" content="Find the latest Government and Private jobs in Delhi NCR. Use our Survival Job Finder and get 2025 Vacancy Alerts for SSC, DSSSB, and MNCs.">
    <meta name="keywords" content="survival job finder, delhi jobs 2025, sarkari naukri alert, private jobs noida, dsssb vacancy, work from home delhi">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <link rel="canonical" href="https://delhizones.com/jobs/">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { primary: '#2563EB', darkBg: '#0f172a' },
                    fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Playfair Display', 'serif'] }
                }
            }
        }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/assets/js/loader.js?v=4.0" defer></script>

    <style>
        #navbar-placeholder { min-height: 80px; display: block; }
        #footer-placeholder { min-height: 300px; display: block; }
        .brand-font { font-family: 'Playfair Display', serif; }
        
        .govt-badge {
            background: linear-gradient(135deg, #1f2937, #111827);
            color: #fbbf24;
            border: 1px solid #374151;
        }
    </style>
</head>

<body class="text-slate-800 bg-slate-50 dark:bg-slate-900 dark:text-slate-200 antialiased selection:bg-blue-100 selection:text-blue-900 flex flex-col min-h-screen">

    <div id="navbar-placeholder"></div>

    <main class="flex-grow pt-10">
        
        <div class="relative bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700">
            <div class="container mx-auto px-6 py-16 relative z-10">
                <div class="text-center max-w-4xl mx-auto">
                    <span class="inline-block py-1 px-3 rounded-full bg-green-100 dark:bg-green-900/30 text-green-700 dark:text-green-300 text-xs font-bold uppercase tracking-wider mb-6">
                        <span class="w-2 h-2 inline-block rounded-full bg-green-500 animate-pulse mr-1"></span> Live Updates
                    </span>
                    <h1 class="text-4xl md:text-6xl font-extrabold text-slate-900 dark:text-white brand-font mb-6 leading-tight">
                        Find Your Next Career in <span class="text-blue-600">Delhi NCR</span>
                    </h1>
                    
                    <div class="relative max-w-2xl mx-auto flex flex-col md:flex-row gap-3">
                        <div class="relative flex-grow">
                            <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 w-5 h-5"></i>
                            <input type="text" id="jobSearch" placeholder="Search by title, department, or company..." 
                                class="w-full pl-12 pr-4 py-4 rounded-xl shadow-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 focus:ring-2 focus:ring-blue-500 focus:outline-none transition text-slate-900 dark:text-white">
                        </div>
                        <button class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-8 rounded-xl shadow-lg transition duration-300 flex items-center justify-center gap-2">
                            Search
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="container mx-auto px-6 py-12">
            <div class="flex flex-col lg:flex-row gap-8">
                
                <aside class="lg:w-1/4 space-y-6">
                    
                    <div class="bg-gradient-to-br from-slate-900 to-slate-800 p-6 rounded-2xl shadow-lg text-white border border-slate-700">
                        <h3 class="font-bold text-lg mb-4 flex items-center gap-2">
                            <i data-lucide="wrench" class="w-5 h-5 text-blue-400"></i> Career Tools
                        </h3>
                        <div class="space-y-3">
                            <a href="/jobs/survival-finder-engine.html" class="flex items-center gap-3 p-3 bg-white/10 hover:bg-white/20 rounded-xl transition group border border-white/5">
                                <div class="bg-orange-500 p-2 rounded-lg group-hover:scale-110 transition-transform">
                                    <i data-lucide="compass" class="w-5 h-5 text-white"></i>
                                </div>
                                <div>
                                    <div class="font-bold text-sm">Survival Job Finder</div>
                                    <div class="text-xs text-slate-400">Instant gigs for urgent cash</div>
                                </div>
                            </a>

                            <a href="/jobs/vacancies-alert-2025.html" class="flex items-center gap-3 p-3 bg-white/10 hover:bg-white/20 rounded-xl transition group border border-white/5">
                                <div class="bg-blue-500 p-2 rounded-lg group-hover:scale-110 transition-transform">
                                    <i data-lucide="bell-ring" class="w-5 h-5 text-white"></i>
                                </div>
                                <div>
                                    <div class="font-bold text-sm">Vacancy Alerts 2025</div>
                                    <div class="text-xs text-slate-400">Get notified for top roles</div>
                                </div>
                            </a>
                        </div>
                    </div>

                    <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
                        <h3 class="font-bold text-lg mb-4 text-slate-900 dark:text-white flex items-center gap-2">
                            <i data-lucide="filter" class="w-5 h-5"></i> Filter Jobs
                        </h3>
                        <div class="space-y-2">
                            <button class="filter-btn active w-full text-left px-4 py-3 rounded-xl text-sm font-medium transition flex justify-between items-center bg-blue-50 dark:bg-slate-700 text-blue-700 dark:text-blue-300 border border-blue-200 dark:border-slate-600" data-category="all">
                                <span>All Jobs</span>
                                <span class="bg-white dark:bg-slate-600 px-2 py-0.5 rounded-md text-xs font-bold">124</span>
                            </button>
                            <button class="filter-btn w-full text-left px-4 py-3 rounded-xl text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700 transition flex justify-between items-center" data-category="govt">
                                <span>Government</span>
                                <span class="bg-slate-100 dark:bg-slate-900 text-slate-500 px-2 py-0.5 rounded-md text-xs font-bold">42</span>
                            </button>
                            <button class="filter-btn w-full text-left px-4 py-3 rounded-xl text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700 transition flex justify-between items-center" data-category="private">
                                <span>Private / MNC</span>
                                <span class="bg-slate-100 dark:bg-slate-900 text-slate-500 px-2 py-0.5 rounded-md text-xs font-bold">68</span>
                            </button>
                        </div>
                    </div>

                </aside>

                <div class="lg:w-3/4">
                    <div id="jobContainer" class="space-y-4">
                        </div>

                    <div id="noResults" class="hidden text-center py-20 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700">
                        <i data-lucide="search-x" class="mx-auto h-12 w-12 text-slate-400 mb-4"></i>
                        <h3 class="text-xl font-bold text-slate-900 dark:text-white">No jobs found</h3>
                        <p class="text-slate-500 mt-2">Try changing your search terms or category.</p>
                    </div>
                </div>

            </div>
        </div>

    </main>

    <div id="footer-placeholder"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            lucide.createIcons();

            // DATA: Updated with REAL TRUSTED LINKS
            const jobs = [
                {
                    title: "Assistant Section Officer (ASO)",
                    company: "Govt of India (SSC CGL)",
                    type: "govt",
                    location: "New Delhi",
                    salary: "₹44,900 - ₹1,42,400",
                    tags: ["Graduate", "Permanent", "Group B"],
                    posted: "2 days ago",
                    verified: true,
                    link: "https://ssc.nic.in/" // Official SSC Site
                },
                {
                    title: "Senior Software Engineer",
                    company: "Paytm (One97)",
                    type: "private",
                    location: "Noida Sec-135",
                    salary: "₹18 LPA - ₹25 LPA",
                    tags: ["Java", "React", "Hybrid"],
                    posted: "Today",
                    verified: false,
                    link: "https://www.naukri.com/paytm-jobs" // Trusted Job Board
                },
                {
                    title: "Constable (Executive)",
                    company: "Delhi Police",
                    type: "govt",
                    location: "Delhi NCR",
                    salary: "₹21,700 + Allowances",
                    tags: ["12th Pass", "Uniform"],
                    posted: "1 week ago",
                    verified: true,
                    link: "https://delhipolice.gov.in/recruitment" // Official Police Site
                },
                {
                    title: "Business Development Executive",
                    company: "PolicyBazaar",
                    type: "private",
                    location: "Gurgaon",
                    salary: "₹4 LPA + Incentives",
                    tags: ["Sales", "Fresher"],
                    posted: "3 days ago",
                    verified: false,
                    link: "https://www.policybazaar.com/careers/" // Official Career Page
                },
                {
                    title: "Digital Marketing Intern",
                    company: "Delhizones Media",
                    type: "internship",
                    location: "Remote / Delhi",
                    salary: "₹10,000 / month",
                    tags: ["SEO", "Content", "Part Time"],
                    posted: "Just Now",
                    verified: false,
                    link: "https://www.linkedin.com/jobs/search/?keywords=digital%20marketing%20intern%20delhi" // LinkedIn Search
                },
                {
                    title: "TGT (Maths/Science)",
                    company: "DSSSB (Delhi Govt)",
                    type: "govt",
                    location: "Delhi Govt Schools",
                    salary: "₹44,900 (Level 7)",
                    tags: ["B.Ed", "CTET", "Teaching"],
                    posted: "Yesterday",
                    verified: true,
                    link: "https://dsssb.delhi.gov.in/" // Official DSSSB Site
                }
            ];

            const jobContainer = document.getElementById('jobContainer');
            const searchInput = document.getElementById('jobSearch');
            const filterBtns = document.querySelectorAll('.filter-btn');
            const noResults = document.getElementById('noResults');

            function renderJobs(data) {
                jobContainer.innerHTML = '';
                
                if (data.length === 0) {
                    noResults.classList.remove('hidden');
                    return;
                }
                noResults.classList.add('hidden');

                data.forEach(job => {
                    const isGovt = job.type === 'govt';
                    const badgeClass = isGovt 
                        ? 'govt-badge text-xs font-bold px-2 py-1 rounded flex items-center gap-1 uppercase tracking-wider' 
                        : 'bg-blue-100 text-blue-700 text-xs font-bold px-2 py-1 rounded border border-blue-200 uppercase tracking-wider';
                    
                    const iconBg = isGovt ? 'bg-slate-900 text-white' : 'bg-white border border-slate-200 text-blue-600';
                    const iconName = isGovt ? 'landmark' : 'briefcase';

                    const html = `
                    <div class="group bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 hover:border-blue-400 dark:hover:border-blue-500 hover:shadow-lg transition-all duration-300 relative">
                        <div class="flex flex-col md:flex-row gap-6">
                            <div class="flex-shrink-0">
                                <div class="w-16 h-16 ${iconBg} rounded-xl flex items-center justify-center shadow-sm">
                                    <i data-lucide="${iconName}" class="w-8 h-8"></i>
                                </div>
                            </div>
                            
                            <div class="flex-grow">
                                <div class="flex flex-col md:flex-row md:justify-between md:items-start mb-2">
                                    <div>
                                        <div class="flex items-center gap-3 mb-1">
                                            <span class="${badgeClass}">
                                                ${isGovt ? '<i data-lucide="shield-check" class="w-3 h-3"></i> Govt' : job.type}
                                            </span>
                                            <span class="text-xs text-slate-400 flex items-center gap-1">
                                                <i data-lucide="clock" class="w-3 h-3"></i> ${job.posted}
                                            </span>
                                        </div>
                                        <h3 class="text-xl font-bold text-slate-900 dark:text-white group-hover:text-blue-600 transition">${job.title}</h3>
                                        <p class="text-slate-600 dark:text-slate-400 font-medium">${job.company}</p>
                                    </div>
                                    
                                    <a href="${job.link}" target="_blank" rel="noopener noreferrer" class="hidden md:flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-lg font-bold transition text-sm shadow-md hover:shadow-blue-500/20">
                                        Apply Now <i data-lucide="external-link" class="w-4 h-4"></i>
                                    </a>
                                </div>

                                <div class="flex flex-wrap gap-4 mt-4 text-sm text-slate-500 dark:text-slate-400">
                                    <div class="flex items-center gap-1.5">
                                        <i data-lucide="map-pin" class="w-4 h-4 text-slate-400"></i> ${job.location}
                                    </div>
                                    <div class="flex items-center gap-1.5">
                                        <i data-lucide="wallet" class="w-4 h-4 text-slate-400"></i> ${job.salary}
                                    </div>
                                </div>

                                <div class="flex flex-wrap gap-2 mt-4">
                                    ${job.tags.map(tag => `<span class="px-2 py-1 bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 text-xs rounded-md border border-slate-200 dark:border-slate-600">${tag}</span>`).join('')}
                                </div>
                            </div>
                        </div>
                        
                        <a href="${job.link}" target="_blank" rel="noopener noreferrer" class="md:hidden mt-6 flex items-center justify-center gap-2 w-full bg-blue-600 text-white py-3 rounded-xl font-bold text-sm">
                            Apply Now <i data-lucide="external-link" class="w-4 h-4"></i>
                        </a>
                    </div>
                    `;
                    jobContainer.insertAdjacentHTML('beforeend', html);
                });
                lucide.createIcons();
            }

            function filterJobs() {
                const query = searchInput.value.toLowerCase();
                const activeCategory = document.querySelector('.filter-btn.active').dataset.category;

                const filtered = jobs.filter(job => {
                    const matchesCategory = activeCategory === 'all' || job.type === activeCategory;
                    const matchesSearch = job.title.toLowerCase().includes(query) || 
                                          job.company.toLowerCase().includes(query) ||
                                          job.tags.some(t => t.toLowerCase().includes(query));
                    return matchesCategory && matchesSearch;
                });

                renderJobs(filtered);
            }

            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterBtns.forEach(b => {
                        b.classList.remove('bg-blue-50', 'dark:bg-slate-700', 'text-blue-700', 'dark:text-blue-300', 'border-blue-200', 'active');
                        b.classList.add('text-slate-600', 'dark:text-slate-400', 'hover:bg-slate-50');
                    });
                    btn.classList.add('bg-blue-50', 'dark:bg-slate-700', 'text-blue-700', 'dark:text-blue-300', 'border-blue-200', 'active');
                    btn.classList.remove('text-slate-600', 'dark:text-slate-400', 'hover:bg-slate-50');
                    
                    filterJobs();
                });
            });

            searchInput.addEventListener('input', filterJobs);
            renderJobs(jobs);
        });
    </script>
</body>
</html>
