    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        } else {
            document.documentElement.classList.remove('dark')
        }
        
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { primary: '#2563EB', darkBg: '#0f172a' },
                    fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Playfair Display', 'serif'] }
                }
            }
        }

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <script src="/assets/js/loader.js?v=9.0" defer></script>

    <style>
        #navbar-placeholder { min-height: 80px; display: block; }
        #footer-placeholder { min-height: 300px; display: block; }
        .brand-font { font-family: 'Playfair Display', serif; }
        
        /* Custom Scrollbar for Tags */
        .no-scrollbar::-webkit-scrollbar { display: none; }

</head>

<body class="text-slate-800 bg-slate-50 dark:bg-slate-900 dark:text-slate-200 antialiased selection:bg-blue-100 selection:text-blue-900 flex flex-col min-h-screen">

    <div id="navbar-placeholder"></div>

    <main class="flex-grow pt-10">
        <div class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 py-16">
            <div class="container mx-auto px-6 text-center">
                <span class="inline-block py-1 px-3 rounded-full bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 text-xs font-bold uppercase tracking-wider mb-4">
                    Web Tools
                </span>
                <h1 class="text-4xl md:text-5xl font-extrabold text-slate-900 dark:text-white brand-font mb-6">
                    Top 20 <span class="text-blue-600">AI Sites</span> Directory
                </h1>
                <p class="text-lg text-slate-600 dark:text-slate-400 max-w-2xl mx-auto">
                    Discover the most powerful artificial intelligence platforms, tools, and services revolutionizing technology today.
                </p>
            </div>
        </div>

        <div class="container mx-auto px-6 py-12">
            
            <div class="flex flex-col md:flex-row gap-4 mb-12 sticky top-24 z-30 bg-slate-50/95 dark:bg-slate-900/95 backdrop-blur py-4 -mx-4 px-4 md:static md:bg-transparent md:p-0">
                <div class="relative flex-grow">
                    <input type="text" id="searchInput" placeholder="Search tools (e.g., 'image', 'coding')..." 
                        class="w-full pl-11 pr-4 py-3.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm text-slate-900 dark:text-white transition-all">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                        <i data-lucide="search" class="text-slate-400 w-5 h-5"></i>
                    </div>
                </div>
                
                <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-2 md:pb-0">
                    <button class="filter-tab active px-4 py-2 rounded-lg text-sm font-bold bg-blue-600 text-white shadow-md transition-all whitespace-nowrap" data-category="all">All</button>
                    <button class="filter-tab px-4 py-2 rounded-lg text-sm font-medium bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 transition-all whitespace-nowrap" data-category="conversational">Chat</button>
                    <button class="filter-tab px-4 py-2 rounded-lg text-sm font-medium bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 transition-all whitespace-nowrap" data-category="image">Image</button>
                    <button class="filter-tab px-4 py-2 rounded-lg text-sm font-medium bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 transition-all whitespace-nowrap" data-category="development">Code</button>
                    <button class="filter-tab px-4 py-2 rounded-lg text-sm font-medium bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 transition-all whitespace-nowrap" data-category="productivity">Productivity</button>
                </div>
            </div>

            <div id="sitesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                </div>

            <div id="no-results" class="hidden text-center py-20">
                <div class="inline-flex bg-slate-100 dark:bg-slate-800 p-4 rounded-full mb-4">
                    <i data-lucide="search-x" class="h-8 w-8 text-slate-400"></i>
                </div>
                <h3 class="text-xl font-bold text-slate-900 dark:text-white">No Results Found</h3>
                <p class="mt-2 text-slate-500 dark:text-slate-400">Try adjusting your search or category filter.</p>
            </div>

        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Data Source
            const aiSites = [
                { name: "ChatGPT", icon: "message-circle", category: "conversational", description: "OpenAI's versatile conversational AI for dialogue, writing, coding, and more.", features: ["Natural Language", "Code Generation", "Writing Assistant"], url: "https://chat.openai.com", pricing: "free" },
                { name: "Claude", icon: "brain-circuit", category: "conversational", description: "Anthropic's helpful and harmless AI assistant, excelling at analysis, writing, and coding.", features: ["Analysis", "Writing", "Coding", "Safety-focused"], url: "https://claude.ai", pricing: "free" },
                { name: "Midjourney", icon: "palette", category: "image", description: "AI-powered tool creating stunning, artistic images from text descriptions.", features: ["Text-to-Image", "Artistic Styles", "High Quality"], url: "https://midjourney.com", pricing: "premium" },
                { name: "DALL-E 3", icon: "image", category: "image", description: "OpenAI's model that creates highly detailed and accurate images from text prompts.", features: ["Text-to-Image", "High Resolution", "Creative Generation"], url: "https://openai.com/dall-e-3", pricing: "premium" },
                { name: "GitHub Copilot", icon: "terminal-square", category: "development", description: "AI pair programmer that suggests code and entire functions in real-time within your editor.", features: ["Code Completion", "Function Generation", "IDE Integration"], url: "https://github.com/features/copilot", pricing: "premium" },
                { name: "Perplexity AI", icon: "search", category: "research", description: "AI search engine providing accurate, real-time answers with cited sources.", features: ["Real-time Search", "Source Citations", "Fact Checking"], url: "https://perplexity.ai", pricing: "free" },
                { name: "Stable Diffusion", icon: "layers", category: "image", description: "Open-source text-to-image model that generates detailed images, known for its customizability.", features: ["Open Source", "Text-to-Image", "Customizable"], url: "https://stability.ai/stable-diffusion", pricing: "free" },
                { name: "Jasper AI", icon: "pen-tool", category: "productivity", description: "AI writing assistant for businesses to generate marketing copy, blog posts, and more.", features: ["Content Generation", "Marketing Copy", "Brand Voice"], url: "https://jasper.ai", pricing: "premium" },
                { name: "Copy.ai", icon: "file-text", category: "productivity", description: "AI-powered copywriting tool to create high-converting copy for ads, emails, and websites.", features: ["Copywriting", "Templates", "Workflows"], url: "https://copy.ai", pricing: "free" },
                { name: "Runway ML", icon: "film", category: "image", description: "Creative AI platform for video editing, image generation, and multimedia content creation.", features: ["Video Editing", "Image Generation", "AI Magic Tools"], url: "https://runwayml.com", pricing: "premium" },
                { name: "Character.AI", icon: "bot", category: "conversational", description: "Platform for creating and chatting with AI characters, from historical figures to original creations.", features: ["Character Creation", "Role Playing", "Community"], url: "https://character.ai", pricing: "free" },
                { name: "Notion AI", icon: "book-marked", category: "productivity", description: "AI features in Notion for writing, brainstorming, and summarizing information.", features: ["Writing Assistant", "Summarization", "Workspace Integration"], url: "https://notion.so/product/ai", pricing: "premium" },
                { name: "Hugging Face", icon: "smile", category: "development", description: "The leading open-source platform for machine learning models, datasets, and applications.", features: ["Model Hub", "Datasets", "Open Source", "Community"], url: "https://huggingface.co", pricing: "free" },
                { name: "Replicate", icon: "refresh-cw", category: "development", description: "Platform to run and scale open-source AI models in the cloud via API.", features: ["Model APIs", "Cloud Scaling", "Easy Integration"], url: "https://replicate.com", pricing: "premium" },
                { name: "Cohere", icon: "globe-2", category: "development", description: "Enterprise-focused AI platform providing advanced language models and NLP tools.", features: ["Enterprise AI", "NLP APIs", "Semantic Search"], url: "https://cohere.ai", pricing: "premium" },
                { name: "Writesonic", icon: "rocket", category: "productivity", description: "AI writing platform for creating high-quality, SEO-optimized articles, ads, and emails.", features: ["Content Creation", "AI Writing", "SEO Optimization"], url: "https://writesonic.com", pricing: "free" },
                { name: "DeepL", icon: "languages", category: "productivity", description: "AI-powered translation service known for its highly accurate and nuanced translations.", features: ["Translation", "High Accuracy", "Document Translation"], url: "https://deepl.com", pricing: "free" },
                { name: "Lensa AI", icon: "camera", category: "image", description: "AI photo editing app that enhances portraits and creates artistic avatars from your photos.", features: ["Photo Enhancement", "Avatar Generation", "Portrait Focus"], url: "https://prisma-ai.com/lensa", pricing: "premium" },
                { name: "Zapier AI", icon: "settings-2", category: "productivity", description: "AI-powered automation to connect different apps and optimize workflow automations.", features: ["Workflow Automation", "App Integration", "No-Code"], url: "https://zapier.com/ai", pricing: "premium" },
                { name: "Gemini", icon: "sparkles", category: "conversational", description: "Google's powerful multimodal AI model, capable of understanding and reasoning across text, images, and code.", features: ["Multimodal", "Advanced Reasoning", "Google Integration"], url: "https://gemini.google.com/", pricing: "free" }
            ];

            const sitesGrid = document.getElementById('sitesGrid');
            const searchInput = document.getElementById('searchInput');
            const filterTabs = document.querySelectorAll('.filter-tab');
            const noResults = document.getElementById('no-results');

            // Render Function
            const renderSites = (sites) => {
                sitesGrid.innerHTML = '';
                if(sites.length === 0){
                    noResults.classList.remove('hidden');
                    return;
                }
                noResults.classList.add('hidden');

                sites.forEach(site => {
                    const card = document.createElement('div');
                    // Tailwind classes for the card
                    card.className = 'bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 hover:shadow-xl hover:-translate-y-1 transition-all duration-300 group flex flex-col h-full';
                    
                    // Logic for Pricing Badge
                    const pricingClass = site.pricing === 'free' 
                        ? 'text-green-700 bg-green-100 dark:bg-green-900/30 dark:text-green-300' 
                        : 'text-amber-700 bg-amber-100 dark:bg-amber-900/30 dark:text-amber-300';

                    card.innerHTML = `
                        <div class="flex items-center gap-4 mb-4">
                            <div class="bg-blue-100 dark:bg-slate-700 text-blue-600 dark:text-blue-400 p-3 rounded-xl group-hover:bg-blue-600 group-hover:text-white transition-colors duration-300">
                                <i data-lucide="${site.icon}"></i>
                            </div>
                            <div>
                                <h3 class="text-lg font-bold text-slate-900 dark:text-white leading-tight">${site.name}</h3>
                                <span class="text-[10px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">${site.category}</span>
                            </div>
                        </div>
                        
                        <p class="text-slate-600 dark:text-slate-400 text-sm mb-6 flex-grow leading-relaxed">${site.description}</p>
                        
                        <div class="flex flex-wrap gap-2 mb-6">
                            ${site.features.slice(0,3).map(f => `<span class="text-[11px] font-semibold bg-slate-100 dark:bg-slate-700/50 text-slate-600 dark:text-slate-300 px-2 py-1 rounded-md border border-slate-200 dark:border-slate-600">${f}</span>`).join('')}
                        </div>
                        
                        <div class="flex justify-between items-center pt-4 border-t border-slate-100 dark:border-slate-700 mt-auto">
                            <span class="text-xs font-bold px-2.5 py-1 rounded-full uppercase tracking-wide ${pricingClass}">${site.pricing}</span>
                            <a href="${site.url}" target="_blank" rel="noopener noreferrer" 
                               class="text-sm font-bold text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300 transition-colors flex items-center gap-1">
                                Visit Site <i data-lucide="arrow-up-right" class="w-4 h-4"></i>
                            </a>
                        </div>
                    `;
                    sitesGrid.appendChild(card);
                });
                
                // Re-init icons for new elements
                if (typeof lucide !== 'undefined') lucide.createIcons();
            };

            // Filter Logic
            const filterAndRender = () => {
                const searchTerm = searchInput.value.toLowerCase();
                const activeCategory = document.querySelector('.filter-tab.active').dataset.category;

                const filteredSites = aiSites.filter(site => {
                    const matchesCategory = activeCategory === 'all' || site.category === activeCategory;
                    const matchesSearch = searchTerm === '' ||
                        site.name.toLowerCase().includes(searchTerm) ||
                        site.description.toLowerCase().includes(searchTerm) ||
                        site.features.some(f => f.toLowerCase().includes(searchTerm));
                    return matchesCategory && matchesSearch;
                });

                renderSites(filteredSites);
            };

            // Event Listeners
            filterTabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    // Update classes for tabs
                    filterTabs.forEach(t => {
                        t.classList.remove('active', 'bg-blue-600', 'text-white', 'shadow-md');
                        t.classList.add('bg-white', 'dark:bg-slate-800', 'text-slate-600', 'dark:text-slate-300', 'border');
                    });
                    
                    // Activate clicked tab
                    tab.classList.remove('bg-white', 'dark:bg-slate-800', 'text-slate-600', 'dark:text-slate-300', 'border');
                    tab.classList.add('active', 'bg-blue-600', 'text-white', 'shadow-md');
                    
                    filterAndRender();
                });
            });

            searchInput.addEventListener('input', filterAndRender);
            
            // Initial Render
            renderSites(aiSites);
        });
    </script>
</body>
</html>
